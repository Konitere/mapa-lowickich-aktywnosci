<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wydarzenie | Mapa Łowickich Aktywności</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --navy:#071d55;
    --red:#e30613;
    --border:#e4e4e4;
    --text:#252525;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#ffffff;
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
}

a{
    font-family:inherit;
}

img{
    display:block;
}


/* =========================
   NAGŁÓWEK
========================= */

.site-header{
    width:100%;
    background:#ffffff;
}

.header-image{
    width:100%;
    max-width:1000px;
    margin:0 auto;
}

.header-image img{
    width:100%;
    height:auto;
}


/* =========================
   MENU
========================= */

.main-nav{
    width:100%;
    border-top:1px solid #eeeeee;
    border-bottom:1px solid #e5e7eb;
    background:white;
}

.nav-inner{
    max-width:1450px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
}

.nav-link{
    position:relative;
    min-height:88px;
    display:flex;
    align-items:center;
    justify-content:center;
    
    padding:14px 18px;
    text-decoration:none;
    color:var(--navy);
    font-weight:800;
}

.nav-link:hover{
    background:#fffafa;
}

.nav-link.active{
    color:var(--red);
}

.nav-link.active::after{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    bottom:0;
    height:4px;
    background:var(--red);
}

.nav-icon{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    flex-shrink:0;
}

.nav-text{
    font-size:18px;
    line-height:1.15;
    font-weight:800;
    text-align:center;
    text-transform:uppercase;
}

.nav-text span{
    display:block;
}


/* =========================
   STRONA WYDARZENIA
========================= */

.event-page{
    width:100%;
    max-width:1060px;
    margin:0 auto;
    padding:48px 30px 90px;
}


/* =========================
   POWRÓT
========================= */

.back-link{
    display:inline-block;
    margin-bottom:34px;
    color:#777;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
}

.back-link:hover{
    color:var(--red);
}


/* =========================
   KATEGORIA
========================= */

.event-category{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:19px;
}

.category-icon{
    width:37px;
    height:37px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:16px;
}

.category-name{
    color:#666;
    font-size:14px;
    line-height:1;
    font-weight:400;
}


/* =========================
   TYTUŁ
========================= */

.event-title{
    margin:0 0 30px;
    color:#252525;
    font-size:42px;
    line-height:1.14;
    font-weight:600;
    letter-spacing:-1px;
}


/* =========================
   PLAKAT
========================= */

.poster-area{
    position:relative;
    width:100%;
    max-height:720px;
    min-height:360px;
    overflow:hidden;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:30px;
}

.poster-background{
    position:absolute;
    inset:-45px;
    width:calc(100% + 90px);
    height:calc(100% + 90px);
    object-fit:cover;
    object-position:center;
    filter:blur(35px);
    opacity:.42;
    transform:scale(1.12);
    z-index:1;
}

.poster-area::after{
    content:"";
    position:absolute;
    inset:0;
    background:transparent;
    z-index:2;
    pointer-events:none;
}

.poster-main{
    position:relative;
    z-index:3;
    max-width:100%;
    max-height:720px;
    width:auto;
    height:auto;
    object-fit:contain;
}

.no-poster{
    position:relative;
    z-index:3;
    min-height:360px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:90px;
}


/* =========================
   DATA I MIEJSCE
========================= */

.event-details{
    width:100%;
    margin-top:0;
}

.detail-row{
    display:flex;
    align-items:flex-start;
    
    padding:8px 0;
}

.detail-icon{
    width:31px;
    min-width:31px;
    height:31px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#444;
}

.detail-icon svg{
    width:27px;
    height:27px;
    stroke:currentColor;
}

.detail-text{
    padding-top:3px;
    color:#333;
    font-size:16px;
    line-height:1.55;
    font-weight:400;
}

.event-date-time{
    text-transform:lowercase;
}


/* =========================
   ORGANIZATOR
========================= */

.organizer-row{
    display:flex;
    align-items:flex-start;
    
    padding:8px 0;
}

.organizer-text{
    padding-top:3px;
    color:#333;
    font-size:16px;
    line-height:1.55;
}


/* =========================
   OPIS
========================= */

.description{
    margin-top:38px;
    padding-top:32px;
    border-top:1px solid var(--border);
}

.description-title{
    margin:0 0 19px;
    color:#252525;
    font-size:25px;
    line-height:1.25;
    font-weight:600;
}

.description-text{
    color:#333;
    font-size:16px;
    line-height:1.75;
    font-weight:400;
    white-space:pre-line;
}


/* =========================
   ŹRÓDŁO
========================= */

.source-wrap{
    margin-top:32px;
}

.source-button{
    display:inline-block;
    padding:13px 25px;
    background:var(--red);
    color:white;
    text-decoration:none;
    font-size:13px;
    line-height:1;
    font-weight:700;
    border-radius:2px;
    transition:.2s;
}

.source-button:hover{
    opacity:.86;
}


/* =========================
   BŁĄD
========================= */

.error{
    padding:80px 20px;
    text-align:center;
}

.error h1{
    color:var(--navy);
    font-size:35px;
}

.error a{
    color:var(--red);
}


/* =========================
   STOPKA
========================= */

.footer{
    border-top:1px solid var(--border);
    padding:35px 20px;
    text-align:center;
    color:#777;
    font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .nav-inner{
        grid-template-columns:repeat(4,1fr);
    }

    .nav-link{
        min-height:82px;
        padding:12px 5px;
        gap:6px;
        flex-direction:column;
    }

    .nav-icon{
        width:27px;
        height:27px;
        font-size:23px;
    }

    .nav-text{
        text-align:center;
        font-size:9px;
    }

    .nav-link.active::after{
        left:5%;
        right:5%;
        height:3px;
    }

    .event-page{
        padding:28px 15px 60px;
    }

    .back-link{
        margin-bottom:25px;
        font-size:12px;
    }

    .event-category{
        margin-bottom:16px;
    }

    .category-icon{
        width:34px;
        height:34px;
        font-size:15px;
    }

    .category-name{
        font-size:13px;
    }

    .event-title{
        margin-bottom:24px;
        font-size:31px;
        line-height:1.13;
        letter-spacing:-.6px;
    }

    .poster-area{
        min-height:240px;
        max-height:600px;
        margin-bottom:24px;
    }

    .poster-main{
        max-height:600px;
    }

    .detail-row,
    .organizer-row{
        gap:13px;
        padding:7px 0;
    }

    .detail-icon{
        width:27px;
        min-width:27px;
        height:27px;
    }

    .detail-icon svg{
        width:24px;
        height:24px;
    }

    .detail-text,
    .organizer-text{
        padding-top:2px;
        font-size:15px;
        line-height:1.5;
    }

    .description{
        margin-top:31px;
        padding-top:27px;
    }

    .description-title{
        font-size:23px;
    }

    .description-text{
        font-size:15px;
        line-height:1.7;
    }

}


@media(max-width:430px){

    .nav-text{
        font-size:8px;
    }

    .event-title{
        font-size:28px;
    }

}


html,
body,
button,
input,
textarea,
select{
    font-family:"Montserrat", Arial, sans-serif !important;
}

</style>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>


<body>


<header class="site-header">

<div class="header-image">

<a href="index.html">

<img
    src="naglowek.png"
    alt="Mapa Łowickich Aktywności"
>

</a>

</div>

</header>


<nav class="main-nav">

<div class="nav-inner">

<a href="index.html#kalendarz" class="nav-link active">
<span class="nav-text">Kalendarz</span>
</a>

<a href="index.html#oprojekcie" class="nav-link">
<span class="nav-text">O projekcie</span>
</a>

</div>

</nav>


<main
    class="event-page"
    id="eventPage"
></main>


<footer class="footer">
    © 2026 Konrad Plichta <span>|</span> Wszelkie prawa zastrzeżone
</footer>


<script>


function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)

        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}



function expandEvents(events){

    const result = [];


    events.forEach(event => {


        if(
            event.type === "cinema" &&
            Array.isArray(event.movies)
        ){


            event.movies.forEach(movie => {


                result.push({

                    title:movie.title,

                    time:movie.times
                        ? movie.times.join(", ")
                        : "",

                    image:movie.image,

                    place:event.place,

                    category:event.category || "Kino",

                    organizer:event.organizer,

                    source:event.source,

                    description:
                        movie.description ||
                        event.description ||
                        ""

                });


            });


        }else{


            result.push(event);


        }


    });


    return result;

}



function getCategoryStyle(category = ""){

    const value = category.toLowerCase();


    if(
        value.includes("kino") ||
        value.includes("film")
    ){

        return {
            icon:"🎬",
            color:"#3d9555"
        };

    }


    if(
        value.includes("koncert") ||
        value.includes("muzyka")
    ){

        return {
            icon:"♫",
            color:"#58a7cd"
        };

    }


    if(
        value.includes("teatr") ||
        value.includes("spektakl")
    ){

        return {
            icon:"🎭",
            color:"#812719"
        };

    }


    if(
        value.includes("kabaret") ||
        value.includes("stand")
    ){

        return {
            icon:"🎭",
            color:"#ef4819"
        };

    }


    if(
        value.includes("warsztat") ||
        value.includes("folklor")
    ){

        return {
            icon:"🧵",
            color:"#f5a900"
        };

    }


    if(
        value.includes("sport") ||
        value.includes("bieg") ||
        value.includes("rower")
    ){

        return {
            icon:"🏃",
            color:"#d40d27"
        };

    }


    if(
        value.includes("rodzin") ||
        value.includes("dziec")
    ){

        return {
            icon:"★",
            color:"#70c7aa"
        };

    }


    if(value.includes("motoryz")){

        return {
            icon:"🚗",
            color:"#ef7f00"
        };

    }


    if(
        value.includes("kultur") ||
        value.includes("literatur")
    ){

        return {
            icon:"📖",
            color:"#373174"
        };

    }


    return {
        icon:"✦",
        color:"#b85193"
    };

}



async function loadEvent(){

    const params =
        new URLSearchParams(window.location.search);


    const dateKey =
        params.get("date");


    const eventIndex =
        Number(params.get("event"));


    if(
        !dateKey ||
        !Number.isInteger(eventIndex)
    ){

        showError();

        return;

    }


    try{


        const cacheBust = Date.now();


        const loadJson = async fileName => {

            try{

                const response = await fetch(

                    fileName + "?v=" + cacheBust

                );


                if(!response.ok){

                    return {};

                }


                return await response.json();


            }catch(error){

                console.warn(
                    "Błąd pliku " + fileName,
                    error
                );

                return {};

            }

        };


        const [
            regularEvents,
            cinemaEvents
        ] = await Promise.all([

            loadJson("events.json"),

            loadJson("cinema.json")

        ]);


        const events = [

            ...(Array.isArray(regularEvents[dateKey])
                ? regularEvents[dateKey]
                : []),

            ...(Array.isArray(cinemaEvents[dateKey])
                ? cinemaEvents[dateKey]
                : [])

        ];


        const event = events[eventIndex];


        if(!event){

            showError();

            return;

        }


        if(
            event.type === "cinema" &&
            Array.isArray(event.movies)
        ){

            window.location.href =

                "repertuar.html?date=" +

                encodeURIComponent(dateKey);


            return;

        }


        renderEvent(
            event,
            dateKey
        );


    }catch(error){


        console.error(error);

        showError();


    }

}


function renderEvent(event,dateKey){

    const page =
        document.getElementById("eventPage");


    const date = new Date(

        dateKey + "T12:00:00"

    );


    const formattedDate =

        date.toLocaleDateString(

            "pl-PL",

            {

                weekday:"long",
                day:"2-digit",
                month:"long",
                year:"numeric"

            }

        );


    const category = getCategoryStyle(

        event.category || ""

    );


    document.title =

        event.title +

        " | Mapa Łowickich Aktywności";


    page.innerHTML = `


        <a
            class="back-link"
            href="index.html"
        >

            ← Wróć do kalendarza

        </a>


        <div class="event-category">


            <div
                class="category-icon"
                style="background:${category.color};"
            >

                ${category.icon}

            </div>


            <div class="category-name">

                ${escapeHtml(
                    event.category || "Wydarzenie"
                )}

            </div>


        </div>


        <h1 class="event-title">

            ${escapeHtml(event.title)}

        </h1>


        <div class="poster-area">


            ${

                event.image

                ? `

                    <img
                        class="poster-main"
                        src="${escapeHtml(event.image)}"
                        alt="${escapeHtml(event.title)}"
                    >

                `

                : `

                    <div class="no-poster">

                        ${category.icon}

                    </div>

                `

            }


        </div>


        <div class="event-details">


            <div class="detail-row">


                <div class="detail-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="16"
                            rx="1"
                        ></rect>

                        <line
                            x1="16"
                            y1="3"
                            x2="16"
                            y2="7"
                        ></line>

                        <line
                            x1="8"
                            y1="3"
                            x2="8"
                            y2="7"
                        ></line>

                        <line
                            x1="3"
                            y1="10"
                            x2="21"
                            y2="10"
                        ></line>

                    </svg>

                </div>


                <div class="detail-text event-date-time">

                    ${formattedDate}

                    ${

                        event.time

                        ? `, ${escapeHtml(event.time)}`

                        : ""

                    }

                </div>


            </div>


            ${

                event.place

                ? `

                    <div class="detail-row">


                        <div class="detail-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="M21 10c0 7-9 12-9 12S3 17 3 10a9 9 0 1 1 18 0z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="10"
                                    r="3"
                                ></circle>

                            </svg>

                        </div>


                        <div class="detail-text">

                            miejsce: ${escapeHtml(event.place)}

                        </div>


                    </div>

                `

                : ""

            }


            ${

                event.organizer

                ? `

                    <div class="organizer-row">


                        <div class="detail-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="7"
                                    r="4"
                                ></circle>

                            </svg>

                        </div>


                        <div class="organizer-text">

                            organizator: ${escapeHtml(event.organizer)}

                        </div>


                    </div>

                `

                : ""

            }


        </div>


        ${

            event.description

            ? `

                <div class="description">


                    <h2 class="description-title">

                        O wydarzeniu

                    </h2>


                    <div class="description-text">

                        ${escapeHtml(event.description)}

                    </div>


                </div>

            `

            : ""

        }


        ${

            event.source

            ? `

                <div class="source-wrap">


                    <a

                        class="source-button"

                        href="${escapeHtml(event.source)}"

                        target="_blank"

                        rel="noopener noreferrer"

                    >

                        Więcej informacji

                    </a>


                </div>

            `

            : ""

        }


    `;

}



function showError(){

    const page =
        document.getElementById("eventPage");


    page.innerHTML = `


        <div class="error">


            <h1>

                Nie znaleziono wydarzenia

            </h1>


            <p>

                Wydarzenie mogło zostać usunięte lub zmienione.

            </p>


            <a href="index.html">

                Wróć do kalendarza

            </a>


        </div>


    `;

}



loadEvent();


</script>


</body>

</html>
