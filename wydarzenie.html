<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wydarzenie | Mapa Łowickich Aktywności</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --navy:#071d55;
    --red:#e30613;
    --border:#e5e7eb;
    --muted:#667085;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#ffffff;
    color:var(--navy);
    font-family:Arial,Helvetica,sans-serif;
}

a{
    font-family:inherit;
}

img{
    display:block;
}


/* =========================
   NAGŁÓWEK
========================= */

.site-header{
    width:100%;
    background:white;
}

.header-image{
    width:100%;
    max-width:1000px;
    margin:0 auto;
}

.header-image img{
    width:100%;
    height:auto;
}


/* =========================
   MENU
========================= */

.main-nav{
    width:100%;
    border-top:1px solid #eeeeee;
    border-bottom:1px solid #e5e7eb;
    background:white;
}

.nav-inner{
    max-width:1450px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.nav-link{
    position:relative;
    min-height:100px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:20px;
    text-decoration:none;
    color:var(--navy);
    font-weight:800;
}

.nav-link:hover{
    background:#fffafa;
}

.nav-link.active{
    color:var(--red);
}

.nav-link.active::after{
    content:"";
    position:absolute;
    left:12%;
    right:12%;
    bottom:0;
    height:4px;
    background:var(--red);
}

.nav-icon{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    flex-shrink:0;
}

.nav-text{
    font-size:17px;
    line-height:1.1;
    text-transform:uppercase;
}

.nav-text span{
    display:block;
}


/* =========================
   STRONA WYDARZENIA
========================= */

.event-page{
    max-width:1100px;
    margin:0 auto;
    padding:55px 35px 90px;
}


/* =========================
   POWRÓT
========================= */

.back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--red);
    text-decoration:none;
    font-size:13px;
    font-weight:800;
    margin-bottom:35px;
}

.back-link:hover{
    text-decoration:underline;
}


/* =========================
   KATEGORIA
========================= */

.event-category{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.category-icon{
    width:45px;
    height:45px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:20px;
}

.category-name{
    font-size:13px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1px;
}


/* =========================
   TYTUŁ
========================= */

.event-title{
    margin:0 0 35px;
    max-width:900px;
    color:var(--navy);
    font-size:46px;
    line-height:1.08;
    font-weight:900;
}


/* =========================
   PLAKAT
========================= */

.poster-area{
    position:relative;
    width:100%;
    min-height:400px;
    max-height:750px;
    overflow:hidden;
    background:#ece9e2;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:45px;
}

.poster-background{
    position:absolute;
    inset:-40px;
    width:calc(100% + 80px);
    height:calc(100% + 80px);
    object-fit:cover;
    filter:blur(35px);
    opacity:.48;
    transform:scale(1.1);
}

.poster-area::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.08);
    z-index:2;
}

.poster-main{
    position:relative;
    z-index:3;
    max-width:100%;
    max-height:750px;
    width:auto;
    height:auto;
    object-fit:contain;
}

.no-poster{
    position:relative;
    z-index:3;
    min-height:400px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:100px;
}


/* =========================
   INFORMACJE
========================= */

.event-information{
    display:grid;
    grid-template-columns:minmax(0,1fr) 320px;
    gap:60px;
    align-items:start;
}

.event-main-info{
    min-width:0;
}

.event-meta{
    border-top:1px solid var(--border);
}

.meta-row{
    display:grid;
    grid-template-columns:150px minmax(0,1fr);
    gap:25px;
    padding:20px 0;
    border-bottom:1px solid var(--border);
}

.meta-label{
    color:var(--muted);
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
}

.meta-value{
    color:var(--navy);
    font-size:18px;
    font-weight:700;
    line-height:1.4;
}


/* =========================
   OPIS
========================= */

.description{
    margin-top:45px;
}

.description-title{
    font-size:27px;
    font-weight:900;
    margin-bottom:20px;
}

.description-text{
    color:#333333;
    font-size:17px;
    line-height:1.75;
    white-space:pre-line;
}


/* =========================
   PANEL BOCZNY
========================= */

.event-sidebar{
    position:sticky;
    top:30px;
    padding:28px;
    background:#faf8f3;
    border-radius:14px;
}

.sidebar-title{
    font-size:20px;
    font-weight:900;
    margin-bottom:20px;
}

.sidebar-date{
    color:var(--navy);
    font-size:22px;
    font-weight:900;
    line-height:1.3;
    margin-bottom:10px;
}

.sidebar-time{
    color:#333333;
    font-size:17px;
    margin-bottom:25px;
}

.source-button{
    display:block;
    width:100%;
    padding:15px 20px;
    border-radius:30px;
    background:var(--red);
    color:white;
    text-align:center;
    text-decoration:none;
    font-size:12px;
    font-weight:900;
    text-transform:uppercase;
    transition:.2s;
}

.source-button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(227,6,19,.25);
}


/* =========================
   BŁĄD
========================= */

.error{
    padding:80px 20px;
    text-align:center;
}

.error h1{
    font-size:35px;
}

.error a{
    color:var(--red);
}


/* =========================
   STOPKA
========================= */

.footer{
    border-top:1px solid var(--border);
    padding:35px 20px;
    text-align:center;
    color:#777;
    font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .nav-inner{
        grid-template-columns:repeat(4,1fr);
    }

    .nav-link{
        min-height:82px;
        padding:12px 5px;
        gap:6px;
        flex-direction:column;
    }

    .nav-icon{
        width:27px;
        height:27px;
        font-size:23px;
    }

    .nav-text{
        text-align:center;
        font-size:9px;
    }

    .nav-link.active::after{
        left:5%;
        right:5%;
        height:3px;
    }

    .event-page{
        padding:30px 16px 60px;
    }

    .back-link{
        margin-bottom:25px;
    }

    .event-category{
        margin-bottom:15px;
    }

    .category-icon{
        width:39px;
        height:39px;
        font-size:18px;
    }

    .category-name{
        font-size:11px;
    }

    .event-title{
        font-size:32px;
        margin-bottom:28px;
    }

    .poster-area{
        min-height:250px;
        max-height:600px;
        border-radius:9px;
        margin-bottom:30px;
    }

    .poster-main{
        max-height:600px;
    }

    .event-information{
        grid-template-columns:1fr;
        gap:35px;
    }

    .event-sidebar{
        position:static;
        order:-1;
        padding:22px;
    }

    .meta-row{
        grid-template-columns:100px minmax(0,1fr);
        gap:15px;
        padding:16px 0;
    }

    .meta-label{
        font-size:11px;
    }

    .meta-value{
        font-size:15px;
    }

    .description{
        margin-top:35px;
    }

    .description-title{
        font-size:23px;
    }

    .description-text{
        font-size:15px;
        line-height:1.7;
    }

}


@media(max-width:430px){

    .nav-text{
        font-size:8px;
    }

    .event-title{
        font-size:28px;
    }

    .meta-row{
        grid-template-columns:85px minmax(0,1fr);
        gap:12px;
    }

}

</style>

</head>


<body>


<header class="site-header">

<div class="header-image">

<a href="index.html">

<img
    src="naglowek.png"
    alt="Mapa Łowickich Aktywności"
>

</a>

</div>

</header>


<nav class="main-nav">

<div class="nav-inner">


<a
    href="index.html"
    class="nav-link active"
>

<span class="nav-icon">📅</span>

<span class="nav-text">
Kalendarz
</span>

</a>


<a
    href="index.html#atrakcje"
    class="nav-link"
>

<span class="nav-icon">⌖</span>

<span class="nav-text">

<span>Atrakcje</span>

<span>w powiecie łowickim</span>

</span>

</a>


<a
    href="index.html#restauracje"
    class="nav-link"
>

<span class="nav-icon">🍴</span>

<span class="nav-text">

<span>Polecane</span>

<span>restauracje</span>

</span>

</a>


<a
    href="index.html#oprojekcie"
    class="nav-link"
>

<span class="nav-icon">ⓘ</span>

<span class="nav-text">
O projekcie
</span>

</a>


</div>

</nav>


<main
    class="event-page"
    id="eventPage"
>

</main>


<footer class="footer">

© 2026 Mapa Łowickich Aktywności

</footer>


<script>


function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}



function expandEvents(events){

    const result = [];


    events.forEach(event => {


        if(
            event.type === "cinema" &&
            Array.isArray(event.movies)
        ){


            event.movies.forEach(movie => {


                result.push({

                    title:movie.title,

                    time:movie.times
                        ? movie.times.join(", ")
                        : "",

                    image:movie.image,

                    place:event.place,

                    category:event.category || "Kino",

                    organizer:event.organizer,

                    source:event.source,

                    description:
                        movie.description ||
                        event.description ||
                        ""

                });


            });


        }else{


            result.push(event);


        }


    });


    return result;

}



function getCategoryStyle(category = ""){

    const value = category.toLowerCase();


    if(
        value.includes("kino") ||
        value.includes("film")
    ){

        return {
            icon:"🎬",
            color:"#3d9555"
        };

    }


    if(
        value.includes("koncert") ||
        value.includes("muzyka")
    ){

        return {
            icon:"♫",
            color:"#58a7cd"
        };

    }


    if(
        value.includes("teatr") ||
        value.includes("spektakl")
    ){

        return {
            icon:"🎭",
            color:"#812719"
        };

    }


    if(
        value.includes("kabaret") ||
        value.includes("stand")
    ){

        return {
            icon:"🎭",
            color:"#ef4819"
        };

    }


    if(
        value.includes("warsztat") ||
        value.includes("folklor")
    ){

        return {
            icon:"🧵",
            color:"#f5a900"
        };

    }


    if(
        value.includes("sport") ||
        value.includes("bieg") ||
        value.includes("rower")
    ){

        return {
            icon:"🏃",
            color:"#d40d27"
        };

    }


    if(
        value.includes("rodzin") ||
        value.includes("dziec")
    ){

        return {
            icon:"★",
            color:"#70c7aa"
        };

    }


    if(value.includes("motoryz")){

        return {
            icon:"🚗",
            color:"#ef7f00"
        };

    }


    if(
        value.includes("kultur") ||
        value.includes("literatur")
    ){

        return {
            icon:"📖",
            color:"#373174"
        };

    }


    return {
        icon:"✦",
        color:"#b85193"
    };

}



async function loadEvent(){

    const page =
        document.getElementById("eventPage");


    const params =
        new URLSearchParams(window.location.search);


    const dateKey =
        params.get("date");


    const eventIndex =
        Number(params.get("event"));


    if(
        !dateKey ||
        !Number.isInteger(eventIndex)
    ){

        showError();

        return;

    }


    try{


        const response = await fetch(

            "events.json?v=" + Date.now()

        );


        if(!response.ok){

            throw new Error("Błąd events.json");

        }


        const eventsData =
            await response.json();


        const events = expandEvents(

            eventsData[dateKey] || []

        );


        const event = events[eventIndex];


        if(!event){

            showError();

            return;

        }


        renderEvent(
            event,
            dateKey
        );


    }catch(error){


        console.error(error);


        showError();


    }

}



function renderEvent(event,dateKey){

    const page =
        document.getElementById("eventPage");


    const date = new Date(

        dateKey + "T12:00:00"

    );


    const formattedDate =

        date.toLocaleDateString(

            "pl-PL",

            {

                weekday:"long",

                day:"numeric",

                month:"long",

                year:"numeric"

            }

        );


    const category = getCategoryStyle(

        event.category || ""

    );


    document.title =

        event.title +

        " | Mapa Łowickich Aktywności";


    page.innerHTML = `


        <a
            class="back-link"
            href="index.html"
        >

            ← WRÓĆ DO KALENDARZA

        </a>


        <div class="event-category">


            <div
                class="category-icon"
                style="background:${category.color};"
            >

                ${category.icon}

            </div>


            <div class="category-name">

                ${escapeHtml(
                    event.category || "Wydarzenie"
                )}

            </div>


        </div>


        <h1 class="event-title">

            ${escapeHtml(event.title)}

        </h1>


        <div class="poster-area">


            ${

                event.image

                ? `

                    <img

                        class="poster-background"

                        src="${escapeHtml(event.image)}"

                        alt=""

                        aria-hidden="true"

                    >


                    <img

                        class="poster-main"

                        src="${escapeHtml(event.image)}"

                        alt="${escapeHtml(event.title)}"

                    >

                `

                : `

                    <div class="no-poster">

                        ${category.icon}

                    </div>

                `

            }


        </div>


        <div class="event-information">


            <div class="event-main-info">


                <div class="event-meta">


                    <div class="meta-row">

                        <div class="meta-label">

                            Data

                        </div>

                        <div class="meta-value">

                            ${formattedDate}

                        </div>

                    </div>


                    ${

                        event.time

                        ? `

                            <div class="meta-row">

                                <div class="meta-label">

                                    Godzina

                                </div>

                                <div class="meta-value">

                                    ${escapeHtml(event.time)}

                                </div>

                            </div>

                        `

                        : ""

                    }


                    ${

                        event.place

                        ? `

                            <div class="meta-row">

                                <div class="meta-label">

                                    Miejsce

                                </div>

                                <div class="meta-value">

                                    ${escapeHtml(event.place)}

                                </div>

                            </div>

                        `

                        : ""

                    }


                    ${

                        event.organizer

                        ? `

                            <div class="meta-row">

                                <div class="meta-label">

                                    Organizator

                                </div>

                                <div class="meta-value">

                                    ${escapeHtml(event.organizer)}

                                </div>

                            </div>

                        `

                        : ""

                    }


                </div>


                ${

                    event.description

                    ? `

                        <div class="description">


                            <div class="description-title">

                                O wydarzeniu

                            </div>


                            <div class="description-text">

                                ${escapeHtml(event.description)}

                            </div>


                        </div>

                    `

                    : ""

                }


            </div>


            <aside class="event-sidebar">


                <div class="sidebar-title">

                    Termin wydarzenia

                </div>


                <div class="sidebar-date">

                    ${formattedDate}

                </div>


                ${

                    event.time

                    ? `

                        <div class="sidebar-time">

                            Godzina ${escapeHtml(event.time)}

                        </div>

                    `

                    : ""

                }


                ${

                    event.source

                    ? `

                        <a

                            class="source-button"

                            href="${escapeHtml(event.source)}"

                            target="_blank"

                            rel="noopener noreferrer"

                        >

                            Zobacz źródło wydarzenia →

                        </a>

                    `

                    : ""

                }


            </aside>


        </div>


    `;

}



function showError(){

    const page =
        document.getElementById("eventPage");


    page.innerHTML = `


        <div class="error">


            <h1>

                Nie znaleziono wydarzenia

            </h1>


            <p>

                Wydarzenie mogło zostać usunięte lub zmienione.

            </p>


            <a href="index.html">

                Wróć do kalendarza

            </a>


        </div>


    `;

}



loadEvent();


</script>


</body>

</html>
