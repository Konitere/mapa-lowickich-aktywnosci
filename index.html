<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa Łowickich Aktywności</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --navy:#071d55;
    --red:#e30613;
    --cream:#fffdfa;
    --border:#e5e7eb;
    --muted:#667085;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#ffffff;
    color:var(--navy);
    font-family:Arial,Helvetica,sans-serif;
}

button,
a{
    font-family:inherit;
}

img{
    display:block;
}


/* =========================
   NAGŁÓWEK
========================= */

.site-header{
    width:100%;
    background:white;
}

.header-image{
    width:100%;
    max-width:1000px;
    margin:0 auto;
}

.header-image img{
    width:100%;
    height:auto;
}


/* =========================
   MENU
========================= */

.main-nav{
    width:100%;
    border-top:1px solid #eeeeee;
    border-bottom:1px solid #e5e7eb;
    background:white;
}

.nav-inner{
    max-width:1450px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.nav-link{
    position:relative;
    min-height:100px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:20px;
    text-decoration:none;
    color:var(--navy);
    font-weight:800;
}

.nav-link:hover{
    background:#fffafa;
}

.nav-link.active{
    color:var(--red);
}

.nav-link.active::after{
    content:"";
    position:absolute;
    left:12%;
    right:12%;
    bottom:0;
    height:4px;
    background:var(--red);
}

.nav-icon{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    flex-shrink:0;
}

.nav-text{
    font-size:17px;
    line-height:1.1;
    text-transform:uppercase;
}

.nav-text span{
    display:block;
}


/* =========================
   STRONA
========================= */

.page{
    max-width:1450px;
    margin:0 auto;
    padding:45px 35px 70px;
}


/* =========================
   GÓRNA SEKCJA
========================= */

.calendar-section{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:45px;
    align-items:stretch;
}


/* =========================
   KALENDARZ
========================= */

.calendar-box{
    width:100%;
}

.month-navigation{
    display:grid;
    grid-template-columns:60px 1fr 60px;
    align-items:center;
    margin-bottom:24px;
}

.month-title{
    text-align:center;
    font-size:32px;
    font-weight:900;
    color:var(--red);
    text-transform:uppercase;
}

.month-btn{
    width:52px;
    height:52px;
    border:0;
    background:transparent;
    color:var(--red);
    font-size:52px;
    line-height:1;
    cursor:pointer;
    transition:.2s;
}

.month-btn:hover{
    transform:scale(1.15);
}

.weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:10px;
}

.weekday{
    text-align:center;
    padding:10px 2px;
    font-size:16px;
    font-weight:900;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    padding:15px;
    background:white;
}

.day{
    position:relative;
    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    color:#111;
    cursor:default;
    border-radius:12px;
    transition:.2s;
}

.day.other-month{
    color:#b8b8b8;
}

.day.has-events{
    cursor:pointer;
}

.day.has-events::after{
    content:"";
    position:absolute;
    bottom:9px;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--red);
}

.day.has-events:hover{
    background:#fff0f1;
    color:var(--red);
}

.day.selected{
    background:var(--red);
    color:white;
    font-weight:900;
    box-shadow:0 7px 18px rgba(227,6,19,.25);
}

.day.selected::after{
    background:white;
}


/* =========================
   ZGŁOŚ WYDARZENIE
========================= */

.submit-event{
    display:block;
    width:100%;
    border-radius:22px;
    overflow:hidden;
    text-decoration:none;
    transition:.25s;
    background:#faf7f0;
}

.submit-event:hover{
    transform:translateY(-5px);
    box-shadow:0 18px 40px rgba(7,29,85,.14);
}

.submit-event img{
    width:100%;
    height:100%;
    object-fit:cover;
}


/* =========================
   SEKCJA WYDARZEŃ
========================= */

.events-section{
    margin-top:48px;
}

.events-heading{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
    font-size:28px;
    font-weight:900;
}

.events-heading-icon{
    width:43px;
    height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
}


/* =========================
   LISTA WYDARZEŃ
========================= */

.events-list{
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--border);
    background:white;
}

.event-card{
    border-bottom:1px solid var(--border);
    background:white;
}

.event-main{
    display:grid;
    grid-template-columns:100px minmax(0,1fr) 180px 55px;
    gap:25px;
    align-items:center;
    min-height:130px;
    padding:18px 25px;
    cursor:pointer;
    transition:.2s;
}

.event-main:hover{
    background:#fffaf7;
}

.event-image{
    width:90px;
    height:90px;
    border-radius:8px;
    overflow:hidden;
    background:#f3f1eb;
    display:flex;
    align-items:center;
    justify-content:center;
}

.event-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
}

.event-info{
    min-width:0;
}

.event-title{
    color:var(--navy);
    font-size:22px;
    font-weight:900;
    line-height:1.2;
    margin-bottom:10px;
}

.event-place{
    color:#555;
    font-size:14px;
}

.event-date-info{
    text-align:right;
}

.event-date-full{
    color:var(--navy);
    font-size:15px;
    font-weight:800;
    text-transform:capitalize;
}

.event-time{
    margin-top:7px;
    color:var(--red);
    font-size:18px;
    font-weight:900;
}

.event-toggle{
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#fff0f1;
    color:var(--red);
    font-size:28px;
    cursor:pointer;
    transition:.25s;
    display:flex;
    align-items:center;
    justify-content:center;
}

.event-card.open .event-toggle{
    transform:rotate(90deg);
    background:var(--red);
    color:white;
}


/* =========================
   ROZWINIĘTE WYDARZENIE
========================= */

.event-details{
    display:none;
    border-top:1px solid #eeeeee;
    background:#fffdf9;
    padding:30px;
}

.event-card.open .event-details{
    display:block;
}

.event-details-inner{
    display:grid;
    grid-template-columns:260px minmax(0,1fr);
    gap:35px;
    max-width:1000px;
    margin:0 auto;
}

.event-poster{
    width:100%;
    max-height:420px;
    object-fit:contain;
    object-position:center;
    background:#f3f1eb;
    border-radius:10px;
}

.event-details-content{
    min-width:0;
}

.event-details-title{
    font-size:25px;
    font-weight:900;
    line-height:1.25;
    margin-bottom:20px;
}

.event-detail-row{
    margin:12px 0;
    color:#333;
    font-size:15px;
    line-height:1.5;
}

.event-source{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    border-radius:25px;
    background:var(--red);
    color:white;
    text-decoration:none;
    font-size:13px;
    font-weight:900;
}

.event-source:hover{
    opacity:.88;
}


/* =========================
   BRAK WYDARZEŃ
========================= */

.empty-events{
    padding:60px 25px;
    text-align:center;
    color:var(--muted);
    font-size:18px;
}


/* =========================
   POKAŻ WIĘCEJ
========================= */

.show-more-wrap{
    display:flex;
    justify-content:center;
    margin-top:25px;
}

.show-more{
    border:1.5px solid var(--red);
    background:white;
    color:var(--red);
    padding:14px 35px;
    border-radius:30px;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
    text-transform:uppercase;
}

.show-more:hover{
    background:var(--red);
    color:white;
}


/* =========================
   STOPKA
========================= */

.footer{
    border-top:1px solid var(--border);
    padding:35px 20px;
    text-align:center;
    color:#777;
    font-size:13px;
}


/* =========================
   TABLET
========================= */

@media(max-width:1100px){

    .page{
        padding-left:20px;
        padding-right:20px;
    }

    .calendar-section{
        gap:25px;
    }

    .event-main{
        grid-template-columns:90px minmax(0,1fr) 160px 50px;
        gap:18px;
    }

    .event-image{
        width:82px;
        height:82px;
    }

    .event-title{
        font-size:19px;
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .nav-inner{
        grid-template-columns:repeat(4,1fr);
    }

    .nav-link{
        min-height:82px;
        padding:12px 5px;
        gap:6px;
        flex-direction:column;
    }

    .nav-icon{
        width:27px;
        height:27px;
        font-size:23px;
    }

    .nav-text{
        text-align:center;
        font-size:9px;
    }

    .nav-link.active::after{
        left:5%;
        right:5%;
        height:3px;
    }

    .page{
        padding:25px 12px 50px;
    }

    .calendar-section{
        grid-template-columns:1fr;
        gap:25px;
    }

    .month-navigation{
        margin-bottom:12px;
    }

    .month-title{
        font-size:25px;
    }

    .month-btn{
        width:45px;
        height:45px;
        font-size:43px;
    }

    .weekday{
        font-size:11px;
    }

    .calendar{
        padding:7px;
        border-radius:13px;
    }

    .day{
        min-height:53px;
        font-size:17px;
        border-radius:8px;
    }

    .day.has-events::after{
        width:4px;
        height:4px;
        bottom:5px;
    }

    .submit-event{
        border-radius:15px;
    }

    .submit-event img{
        height:auto;
    }

    .events-section{
        margin-top:35px;
    }

    .events-heading{
        font-size:21px;
        margin-bottom:17px;
    }

    .events-heading-icon{
        width:32px;
        height:32px;
        font-size:25px;
    }

    .event-main{
        grid-template-columns:72px minmax(0,1fr) 35px;
        grid-template-areas:
            "image info toggle"
            "image date toggle";
        gap:5px 13px;
        min-height:105px;
        padding:13px 10px;
    }

    .event-image{
        grid-area:image;
        width:72px;
        height:72px;
    }

    .event-info{
        grid-area:info;
    }

    .event-title{
        font-size:16px;
        margin-bottom:5px;
    }

    .event-place{
        font-size:11px;
    }

    .event-date-info{
        grid-area:date;
        text-align:left;
        display:flex;
        gap:8px;
        align-items:center;
        flex-wrap:wrap;
    }

    .event-date-full{
        font-size:11px;
    }

    .event-time{
        margin:0;
        font-size:12px;
    }

    .event-toggle{
        grid-area:toggle;
        width:32px;
        height:32px;
        font-size:20px;
    }

    .event-details{
        padding:18px 12px;
    }

    .event-details-inner{
        grid-template-columns:1fr;
        gap:18px;
    }

    .event-poster{
        max-height:500px;
    }

    .event-details-title{
        font-size:20px;
    }

}


/* =========================
   MAŁE TELEFONY
========================= */

@media(max-width:430px){

    .nav-text{
        font-size:8px;
    }

    .weekday{
        font-size:9px;
    }

    .day{
        min-height:47px;
        font-size:15px;
    }

    .month-title{
        font-size:22px;
    }

    .event-main{
        grid-template-columns:64px minmax(0,1fr) 32px;
        grid-template-areas:
            "image info toggle"
            "image date toggle";
        gap:5px 10px;
        padding:12px 7px;
    }

    .event-image{
        width:64px;
        height:64px;
    }

    .event-title{
        font-size:15px;
    }

}

</style>

</head>


<body>


<!-- =========================
     NAGŁÓWEK
========================= -->

<header class="site-header">

    <div class="header-image">

        <img
            src="naglowek.png"
            alt="Mapa Łowickich Aktywności"
        >

    </div>

</header>


<!-- =========================
     MENU
========================= -->

<nav class="main-nav">

    <div class="nav-inner">

        <a
            href="#kalendarz"
            class="nav-link active"
        >

            <span class="nav-icon">
                📅
            </span>

            <span class="nav-text">
                Kalendarz
            </span>

        </a>


        <a
            href="#atrakcje"
            class="nav-link"
        >

            <span class="nav-icon">
                ⌖
            </span>

            <span class="nav-text">

                <span>Atrakcje</span>

                <span>
                    w powiecie łowickim
                </span>

            </span>

        </a>


        <a
            href="#restauracje"
            class="nav-link"
        >

            <span class="nav-icon">
                🍴
            </span>

            <span class="nav-text">

                <span>Polecane</span>

                <span>restauracje</span>

            </span>

        </a>


        <a
            href="#oprojekcie"
            class="nav-link"
        >

            <span class="nav-icon">
                ⓘ
            </span>

            <span class="nav-text">
                O projekcie
            </span>

        </a>

    </div>

</nav>


<!-- =========================
     STRONA
========================= -->

<main
    class="page"
    id="kalendarz"
>


    <!-- =========================
         KALENDARZ + ZGŁOŚ
    ========================= -->

    <section class="calendar-section">


        <div class="calendar-box">


            <div class="month-navigation">


                <button
                    class="month-btn"
                    id="prevMonth"
                    aria-label="Poprzedni miesiąc"
                >
                    ‹
                </button>


                <div
                    class="month-title"
                    id="monthTitle"
                ></div>


                <button
                    class="month-btn"
                    id="nextMonth"
                    aria-label="Następny miesiąc"
                >
                    ›
                </button>


            </div>


            <div class="weekdays">

                <div class="weekday">PN</div>

                <div class="weekday">WT</div>

                <div class="weekday">ŚR</div>

                <div class="weekday">CZW</div>

                <div class="weekday">PT</div>

                <div class="weekday">SOB</div>

                <div class="weekday">NDZ.</div>

            </div>


            <div
                class="calendar"
                id="calendar"
            ></div>


        </div>


        <!-- ZGŁOŚ WYDARZENIE -->

        <a
            href="#"
            class="submit-event"
            id="submitEvent"
        >

            <img
                src="zglos-wydarzenie.png"
                alt="Zgłoś wydarzenie"
            >

        </a>


    </section>


    <!-- =========================
         WYDARZENIA
    ========================= -->

    <section class="events-section">


        <div class="events-heading">

            <span class="events-heading-icon">
                🗓
            </span>

            <span id="eventsHeading">
                Nadchodzące wydarzenia
            </span>

        </div>


        <div
            class="events-list"
            id="eventsList"
        ></div>


        <div
            class="show-more-wrap"
            id="showMoreWrap"
        >

            <button
                class="show-more"
                id="showMore"
            >

                Pokaż więcej wydarzeń ↓

            </button>

        </div>


    </section>


</main>


<footer class="footer">

    © 2026 Mapa Łowickich Aktywności

</footer>


<script>


/* =========================
   NAZWY
========================= */

const MONTHS = [

    "STYCZEŃ",
    "LUTY",
    "MARZEC",
    "KWIECIEŃ",
    "MAJ",
    "CZERWIEC",
    "LIPIEC",
    "SIERPIEŃ",
    "WRZESIEŃ",
    "PAŹDZIERNIK",
    "LISTOPAD",
    "GRUDZIEŃ"

];


/* =========================
   ZMIENNE
========================= */

let eventsData = {};

const today = new Date();

let currentYear = today.getFullYear();

let currentMonth = today.getMonth();

let selectedDate = null;

let visibleEvents = 6;


/* =========================
   DATA
========================= */

function formatDateKey(
    year,
    month,
    day
){

    return [

        year,

        String(
            month + 1
        ).padStart(
            2,
            "0"
        ),

        String(
            day
        ).padStart(
            2,
            "0"
        )

    ].join("-");

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


/* =========================
   KINO
========================= */

function expandEvents(events){

    const result = [];

    events.forEach(event => {

        if(

            event.type === "cinema" &&

            Array.isArray(
                event.movies
            )

        ){

            event.movies.forEach(movie => {

                result.push({

                    title:
                        movie.title,

                    time:
                        movie.times
                            ? movie.times.join(", ")
                            : "",

                    image:
                        movie.image,

                    place:
                        event.place,

                    category:
                        event.category || "Kino",

                    organizer:
                        event.organizer,

                    source:
                        event.source

                });

            });

        }else{

            result.push(event);

        }

    });

    return result;

}


/* =========================
   WCZYTYWANIE JSON
========================= */

async function loadEvents(){

    try{

        const response =
            await fetch(
                "events.json?v=" +
                Date.now()
            );

        if(!response.ok){

            throw new Error(
                "Błąd events.json"
            );

        }

        eventsData =
            await response.json();

        renderCalendar();

        renderUpcomingEvents();

    }catch(error){

        console.error(error);

        document
            .getElementById(
                "eventsList"
            )
            .innerHTML = `

                <div class="empty-events">

                    Nie udało się wczytać wydarzeń.

                </div>

            `;

    }

}


/* =========================
   KALENDARZ
========================= */

function renderCalendar(){

    const calendar =
        document.getElementById(
            "calendar"
        );

    calendar.innerHTML = "";

    document
        .getElementById(
            "monthTitle"
        )
        .textContent =

        MONTHS[currentMonth] +
        " " +
        currentYear;


    const firstDay =
        new Date(
            currentYear,
            currentMonth,
            1
        );

    const lastDay =
        new Date(
            currentYear,
            currentMonth + 1,
            0
        );

    let startDay =
        firstDay.getDay();

    if(startDay === 0){

        startDay = 7;

    }


    const previousMonthLastDay =

        new Date(
            currentYear,
            currentMonth,
            0
        )
        .getDate();


    for(

        let i = startDay - 2;

        i >= 0;

        i--

    ){

        createDay(

            previousMonthLastDay - i,

            true

        );

    }


    for(

        let day = 1;

        day <= lastDay.getDate();

        day++

    ){

        createDay(
            day,
            false
        );

    }


    const cells =
        calendar.children.length;

    const targetCells =
        cells <= 35
            ? 35
            : 42;

    const remaining =
        targetCells - cells;


    for(

        let day = 1;

        day <= remaining;

        day++

    ){

        createDay(
            day,
            true
        );

    }

}


/* =========================
   DZIEŃ
========================= */

function createDay(
    day,
    otherMonth
){

    const calendar =
        document.getElementById(
            "calendar"
        );

    const cell =
        document.createElement(
            "div"
        );

    cell.className = "day";


    if(otherMonth){

        cell.classList.add(
            "other-month"
        );

        cell.textContent = day;

        calendar.appendChild(
            cell
        );

        return;

    }


    const dateKey =
        formatDateKey(

            currentYear,

            currentMonth,

            day

        );


    const events =
        expandEvents(

            eventsData[dateKey] || []

        );


    if(events.length){

        cell.classList.add(
            "has-events"
        );

        cell.addEventListener(

            "click",

            () => {

                selectDate(
                    dateKey
                );

            }

        );

    }


    if(
        selectedDate === dateKey
    ){

        cell.classList.add(
            "selected"
        );

    }


    cell.textContent = day;

    calendar.appendChild(
        cell
    );

}


/* =========================
   WYBÓR DNIA
========================= */

function selectDate(dateKey){

    selectedDate = dateKey;

    visibleEvents = 6;

    renderCalendar();

    renderSelectedEvents();

    document
        .querySelector(
            ".events-section"
        )
        .scrollIntoView({

            behavior:"smooth",

            block:"start"

        });

}


/* =========================
   WYDARZENIA DNIA
========================= */

function renderSelectedEvents(){

    const date =
        new Date(
            selectedDate +
            "T12:00:00"
        );

    const events =
        expandEvents(

            eventsData[selectedDate] || []

        );

    document
        .getElementById(
            "eventsHeading"
        )
        .textContent =

        "Wydarzenia – " +

        date.getDate() +

        " " +

        MONTHS[
            date.getMonth()
        ].toLowerCase();


    renderEvents(
        events
    );

}


/* =========================
   NADCHODZĄCE
========================= */

function renderUpcomingEvents(){

    const allEvents = [];

    const now = new Date();

    const todayKey = formatDateKey(

        now.getFullYear(),

        now.getMonth(),

        now.getDate()

    );


    Object.keys(eventsData)

        .filter(key =>

            /^\d{4}-\d{2}-\d{2}$/.test(key)

        )

        .filter(dateKey =>

            dateKey >= todayKey

        )

        .sort()

        .forEach(dateKey => {

            const events =
                expandEvents(

                    eventsData[dateKey] || []

                );

            events.forEach(event => {

                allEvents.push({

                    ...event,

                    dateKey

                });

            });

        });


    document
        .getElementById(
            "eventsHeading"
        )
        .textContent =

        "Nadchodzące wydarzenia";


    renderEvents(
        allEvents
    );

}


/* =========================
   RENDER WYDARZEŃ
========================= */

function renderEvents(events){

    const list =
        document.getElementById(
            "eventsList"
        );

    const showMoreWrap =
        document.getElementById(
            "showMoreWrap"
        );


    if(!events.length){

        list.innerHTML = `

            <div class="empty-events">

                Brak wydarzeń w tym dniu.

            </div>

        `;

        showMoreWrap.style.display =
            "none";

        return;

    }


    const visible =
        events.slice(
            0,
            visibleEvents
        );


    list.innerHTML =

        visible.map((event,index) => {


            const dateKey =

                event.dateKey ||

                selectedDate;


            const date =

                new Date(

                    dateKey +
                    "T12:00:00"

                );


            const formattedDate =

                date.toLocaleDateString(

                    "pl-PL",

                    {

                        weekday:"long",

                        day:"numeric",

                        month:"long"

                    }

                );


            return `


                <article
                    class="event-card"
                    data-event="${index}"
                >


                    <div
                        class="event-main"
                        onclick="toggleEvent(this)"
                    >


                        <div class="event-image">


                            ${

                                event.image

                                ? `

                                    <img

                                        src="${escapeHtml(
                                            event.image
                                        )}"

                                        alt="${escapeHtml(
                                            event.title
                                        )}"

                                        loading="lazy"

                                        onerror="
                                            this.style.display='none'
                                        "

                                    >

                                `

                                : ""

                            }


                        </div>


                        <div class="event-info">


                            <div class="event-title">

                                ${escapeHtml(
                                    event.title
                                )}

                            </div>


                            ${

                                event.place

                                ? `

                                    <div class="event-place">

                                        📍

                                        ${escapeHtml(
                                            event.place
                                        )}

                                    </div>

                                `

                                : ""

                            }


                        </div>


                        <div class="event-date-info">


                            <div class="event-date-full">

                                ${formattedDate}

                            </div>


                            ${

                                event.time

                                ? `

                                    <div class="event-time">

                                        ${escapeHtml(
                                            event.time
                                        )}

                                    </div>

                                `

                                : ""

                            }


                        </div>


                        <button
                            class="event-toggle"
                            type="button"
                            aria-label="Rozwiń wydarzenie"
                        >

                            ›

                        </button>


                    </div>


                    <div class="event-details">


                        <div class="event-details-inner">


                            <div>


                                ${

                                    event.image

                                    ? `

                                        <img

                                            class="event-poster"

                                            src="${escapeHtml(
                                                event.image
                                            )}"

                                            alt="${escapeHtml(
                                                event.title
                                            )}"

                                        >

                                    `

                                    : ""

                                }


                            </div>


                            <div class="event-details-content">


                                <div class="event-details-title">

                                    ${escapeHtml(
                                        event.title
                                    )}

                                </div>


                                <div class="event-detail-row">

                                    📅

                                    <strong>Data:</strong>

                                    ${formattedDate}

                                </div>


                                ${

                                    event.time

                                    ? `

                                        <div class="event-detail-row">

                                            🕐

                                            <strong>Godzina:</strong>

                                            ${escapeHtml(
                                                event.time
                                            )}

                                        </div>

                                    `

                                    : ""

                                }


                                ${

                                    event.place

                                    ? `

                                        <div class="event-detail-row">

                                            📍

                                            <strong>Miejsce:</strong>

                                            ${escapeHtml(
                                                event.place
                                            )}

                                        </div>

                                    `

                                    : ""

                                }


                                ${

                                    event.organizer

                                    ? `

                                        <div class="event-detail-row">

                                            👤

                                            <strong>Organizator:</strong>

                                            ${escapeHtml(
                                                event.organizer
                                            )}

                                        </div>

                                    `

                                    : ""

                                }


                                ${

                                    event.category

                                    ? `

                                        <div class="event-detail-row">

                                            <strong>Kategoria:</strong>

                                            ${escapeHtml(
                                                event.category
                                            )}

                                        </div>

                                    `

                                    : ""

                                }


                                ${

                                    event.source

                                    ? `

                                        <a

                                            class="event-source"

                                            href="${escapeHtml(
                                                event.source
                                            )}"

                                            target="_blank"

                                            rel="noopener noreferrer"

                                            onclick="
                                                event.stopPropagation()
                                            "

                                        >

                                            ZOBACZ ŹRÓDŁO →

                                        </a>

                                    `

                                    : ""

                                }


                            </div>


                        </div>


                    </div>


                </article>


            `;


        }).join("");


    showMoreWrap.style.display =

        events.length > visibleEvents

            ? "flex"

            : "none";


    document
        .getElementById(
            "showMore"
        )
        .onclick = () => {

            visibleEvents += 6;

            renderEvents(
                events
            );

        };

}


/* =========================
   ROZWIJANIE WYDARZENIA
========================= */

function toggleEvent(element){

    const card =
        element.closest(
            ".event-card"
        );

    const wasOpen =
        card.classList.contains(
            "open"
        );


    document
        .querySelectorAll(
            ".event-card.open"
        )
        .forEach(item => {

            item.classList.remove(
                "open"
            );

        });


    if(!wasOpen){

        card.classList.add(
            "open"
        );

    }

}


/* =========================
   ZMIANA MIESIĄCA
========================= */

document
    .getElementById(
        "prevMonth"
    )
    .addEventListener(

        "click",

        () => {

            currentMonth--;

            if(currentMonth < 0){

                currentMonth = 11;

                currentYear--;

            }

            selectedDate = null;

            renderCalendar();

            renderUpcomingEvents();

        }

    );


document
    .getElementById(
        "nextMonth"
    )
    .addEventListener(

        "click",

        () => {

            currentMonth++;

            if(currentMonth > 11){

                currentMonth = 0;

                currentYear++;

            }

            selectedDate = null;

            renderCalendar();

            renderUpcomingEvents();

        }

    );


/* =========================
   ZGŁOŚ WYDARZENIE
========================= */

document
    .getElementById(
        "submitEvent"
    )
    .addEventListener(

        "click",

        event => {

            event.preventDefault();

            alert(

                "Formularz zgłaszania wydarzeń dodamy w kolejnym kroku."

            );

        }

    );


/* =========================
   START
========================= */

loadEvents();


</script>
