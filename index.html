<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa Łowickich Aktywności</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --red:#d71920;
    --dark:#151515;
    --cream:#faf7f0;
    --border:#dedbd4;
    --muted:#777;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--cream);
    color:var(--dark);
}

button{
    font-family:inherit;
}

/* HEADER */

.header{
    background:white;
    border-bottom:1px solid #e7e3dc;
    padding:18px 30px;
}

.header-inner{
    max-width:1500px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo img{
    height:65px;
    max-width:420px;
    object-fit:contain;
}

.header-title{
    font-size:27px;
    font-weight:900;
    line-height:1;
}

.header-title span{
    display:block;
}

.nav{
    display:flex;
    align-items:center;
    gap:30px;
    font-size:15px;
    font-weight:700;
}

.nav-item{
    color:#222;
    text-decoration:none;
    padding:10px 0;
}

.nav-item.active{
    color:var(--red);
    border-bottom:3px solid var(--red);
}

/* PAGE */

.page{
    max-width:1500px;
    margin:auto;
    padding:32px 25px 60px;
}

.top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:25px;
}

.page-title{
    font-size:32px;
    font-weight:900;
    margin:0;
}

.page-title span{
    color:var(--red);
    font-family:Georgia,serif;
    font-style:italic;
    font-weight:400;
}

.filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

.filter{
    border:1px solid #ccc;
    background:white;
    padding:11px 22px;
    border-radius:30px;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
}

.filter:hover{
    border-color:var(--red);
}

.filter.active{
    background:var(--red);
    border-color:var(--red);
    color:white;
}

/* MONTH NAV */

.month-navigation{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:30px;
    min-width:360px;
}

.month-title{
    font-size:34px;
    font-weight:900;
    text-transform:uppercase;
    min-width:260px;
    text-align:center;
}

.month-btn{
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid #ddd;
    background:white;
    font-size:28px;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.month-btn:hover{
    transform:scale(1.05);
}

/* CALENDAR */

.calendar-wrap{
    width:100%;
}

.weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:8px;
}

.weekday{
    text-align:center;
    font-size:12px;
    font-weight:900;
    padding:8px;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    border-left:1px solid var(--border);
    border-top:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:white;
}

.day{
    min-height:190px;
    position:relative;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    background:#fff;
    cursor:default;
    overflow:hidden;
}

.day.has-events{
    cursor:pointer;
}

.day.has-events:hover{
    z-index:3;
    box-shadow:0 0 0 3px var(--red) inset;
}

.day.selected{
    box-shadow:0 0 0 4px var(--red) inset;
    z-index:4;
}

.day.other-month{
    background:#fafafa;
}

.day-number{
    position:absolute;
    top:10px;
    left:12px;
    z-index:10;
    font-size:25px;
    font-weight:900;
}

.other-month .day-number{
    color:#c8c8c8;
}

.poster-background{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.poster-background img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.poster-background::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.08),
        rgba(0,0,0,.18) 40%,
        rgba(0,0,0,.86)
    );
}

.has-poster .day-number{
    color:white;
    text-shadow:0 2px 8px rgba(0,0,0,.8);
}

.event-summary{
    position:absolute;
    left:12px;
    right:12px;
    bottom:10px;
    z-index:10;
    color:#222;
}

.has-poster .event-summary{
    color:white;
}

.category-icons{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:6px;
}

.category-icon{
    display:flex;
    align-items:center;
    justify-content:center;
    width:27px;
    height:27px;
    border-radius:7px;
    background:rgba(255,255,255,.92);
    font-size:16px;
}

.more-count{
    font-size:14px;
    font-weight:900;
}

.event-count{
    font-size:12px;
    font-weight:800;
}

.simple-summary{
    position:absolute;
    left:0;
    right:0;
    bottom:18px;
    text-align:center;
}

.simple-icons{
    font-size:22px;
    margin-bottom:7px;
}

.simple-count{
    font-size:12px;
    font-weight:700;
}

/* MOSAIC */

.poster-mosaic{
    position:absolute;
    inset:0;
    display:grid;
}

.poster-mosaic.count-2{
    grid-template-columns:1fr 1fr;
}

.poster-mosaic.count-3{
    grid-template-columns:2fr 1fr;
    grid-template-rows:1fr 1fr;
}

.poster-mosaic.count-3 img:first-child{
    grid-row:1 / 3;
}

.poster-mosaic.count-many{
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
}

.poster-mosaic img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    min-width:0;
    min-height:0;
    background:#f1eee7;
}

.poster-mosaic::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.05),
        rgba(0,0,0,.2),
        rgba(0,0,0,.88)
    );
}

/* DETAILS */

.details{
    margin-top:22px;
    background:#fffdf8;
    border:1px solid #eee7db;
    border-radius:18px;
    padding:30px;
    display:none;
}

.details.visible{
    display:block;
}

.details-grid{
    display:grid;
    grid-template-columns:180px 1fr;
    gap:35px;
}

.date-panel{
    padding:10px 15px;
}

.date-weekday{
    color:var(--red);
    font-size:15px;
    font-weight:900;
    letter-spacing:3px;
    text-transform:uppercase;
}

.date-number{
    font-size:85px;
    line-height:.95;
    font-weight:900;
    margin-top:12px;
}

.date-month{
    font-size:17px;
    font-weight:800;
    margin-top:12px;
    text-transform:uppercase;
}

.date-year{
    font-size:14px;
    color:#777;
    margin-top:4px;
}

.stats{
    margin-top:28px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:18px;
    background:white;
}

.stats-total{
    font-size:17px;
    font-weight:900;
    margin-bottom:15px;
}

.stat-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    margin:9px 0;
}

.stat-name{
    display:flex;
    align-items:center;
    gap:7px;
}

/* EVENT AREA */

.events-area{
    min-width:0;
}

.events-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding-bottom:14px;
    margin-bottom:20px;
}

.events-title{
    font-size:18px;
    font-weight:900;
}

.close-details{
    border:0;
    background:none;
    color:var(--red);
    font-size:12px;
    font-weight:900;
    cursor:pointer;
}

.event-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:18px;
}

.event-card{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    overflow:hidden;
    transition:.2s;
    display:flex;
    flex-direction:column;
}

.event-card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.event-image{
    height:220px;
    position:relative;
    background:#eee;
    overflow:hidden;
}

.event-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    background:#f1eee7;
}

.event-time{
    position:absolute;
    top:10px;
    left:10px;
    padding:7px 10px;
    background:var(--red);
    color:white;
    border-radius:7px;
    font-size:13px;
    font-weight:900;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.event-content{
    padding:14px;
    display:flex;
    flex-direction:column;
    flex:1;
}

.event-name{
    font-size:16px;
    font-weight:900;
    line-height:1.25;
    margin-bottom:8px;
}

.event-place{
    font-size:12px;
    color:#555;
    margin-bottom:6px;
}

.event-organizer{
    font-size:11px;
    color:#888;
    margin-bottom:12px;
}

.event-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-top:auto;
}

.category-tag{
    display:inline-block;
    padding:5px 8px;
    border-radius:5px;
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
    background:#eee;
}

.event-link{
    color:var(--red);
    text-decoration:none;
    font-size:11px;
    font-weight:900;
}

.event-link:hover{
    text-decoration:underline;
}

/* CINEMA */

.cinema-card .event-image{
    height:220px;
}

.cinema-times{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    margin-top:8px;
}

.cinema-time{
    background:#167ac6;
    color:white;
    padding:5px 8px;
    border-radius:5px;
    font-size:11px;
    font-weight:900;
}

/* EMPTY */

.empty-info{
    padding:45px;
    text-align:center;
    color:#777;
}

.empty-icon{
    font-size:45px;
    margin-bottom:15px;
}

/* FOOTER */

.footer{
    background:white;
    border-top:1px solid #e7e3dc;
    padding:30px;
    text-align:center;
    color:#777;
    font-size:13px;
}
/* ŁOWICKIE DEKORACJE */

.folk-top{
    height:70px;
    width:100%;
    background-image:url("wycinanka-lowicka.png");
    background-size:100% auto;
    background-position:center top;
    background-repeat:no-repeat;
    margin-bottom:10px;
}

.folk-date-decoration{
    width:170px;
    height:95px;
    background-image:url("wycinanka-lowicka.png");
    background-size:350px auto;
    background-position:center bottom;
    background-repeat:no-repeat;
    margin-top:20px;
}
/* MOBILE */

@media(max-width:1100px){

    .event-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .day{
        min-height:120px;
    }

}

@media(max-width:800px){

    .header{
        padding:12px 15px;
    }

    .logo img{
        height:48px;
        max-width:280px;
    }

    .nav{
        display:none;
    }

    .page{
        padding:20px 10px 40px;
    }

    .top-row{
        display:block;
    }

    .page-title{
        font-size:25px;
    }

    .month-navigation{
        margin-top:25px;
        min-width:0;
        gap:15px;
    }

    .month-title{
        font-size:25px;
        min-width:190px;
    }

    .month-btn{
        width:42px;
        height:42px;
    }

    .filters{
        overflow-x:auto;
        flex-wrap:nowrap;
        padding-bottom:5px;
    }

    .filter{
        white-space:nowrap;
        padding:9px 17px;
    }

    .weekday{
        font-size:10px;
        padding:6px 1px;
    }

    .day{
        min-height:85px;
    }

    .day-number{
        font-size:18px;
        top:7px;
        left:8px;
    }

    .event-summary{
        left:6px;
        right:6px;
        bottom:6px;
    }

    .category-icon{
        width:21px;
        height:21px;
        font-size:13px;
    }

    .event-count{
        font-size:9px;
    }

    .more-count{
        font-size:10px;
    }

    .simple-summary{
        bottom:9px;
    }

    .simple-icons{
        font-size:15px;
        margin-bottom:3px;
    }

    .simple-count{
        font-size:8px;
    }

    .details{
        padding:18px 10px;
    }

    .details-grid{
        display:block;
    }

    .date-panel{
        display:flex;
        align-items:center;
        gap:12px;
        padding:0 5px 18px;
    }

    .date-weekday{
        font-size:12px;
        letter-spacing:1px;
    }

    .date-number{
        font-size:48px;
        margin:0;
    }

    .date-month{
        margin:0;
        font-size:14px;
    }

    .date-year{
        margin:0;
    }

    .stats{
        display:none;
    }

    .event-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
    }

    .event-image,
    .cinema-card .event-image{
        height:180px;
    }

    .event-content{
        padding:10px;
    }

    .event-name{
        font-size:14px;
    }

    .event-place{
        font-size:11px;
    }

    .event-organizer{
        display:none;
    }

}

@media(max-width:480px){

    .page-title{
        font-size:22px;
    }

    .calendar{
        border-radius:7px;
    }

    .day{
        min-height:72px;
    }

    .day-number{
        font-size:16px;
    }

    .category-icons{
        gap:2px;
        margin-bottom:3px;
    }

    .category-icon{
        width:18px;
        height:18px;
        font-size:11px;
        border-radius:4px;
    }

    .event-count{
        display:none;
    }

    .simple-icons{
        font-size:13px;
    }

    .simple-count{
        font-size:7px;
    }

    .event-grid{
        grid-template-columns:1fr;
    }

    .event-image,
    .cinema-card .event-image{
        height:280px;
    }

}

</style>
</head>

<body>

<header class="header">
    <div class="header-inner">

        <div class="logo">
            <img src="header.png" alt="Mapa Łowickich Aktywności">
        </div>

        <nav class="nav">
            <a href="#" class="nav-item">⌖ Mapa</a>
            <a href="#" class="nav-item">♙ Organizatorzy</a>
            <a href="#" class="nav-item active">▣ Kalendarz</a>
            <a href="#" class="nav-item">ⓘ O projekcie</a>
        </nav>

    </div>
</header>


<main class="page">
    <div class="folk-top"></div>

    <div class="top-row">

        <div>
            <h1 class="page-title">
                KALENDARZ WYDARZEŃ
                <span>w Łowiczu</span>
            </h1>

            <div class="filters">
                <button class="filter active" data-filter="all">WSZYSTKIE</button>
                <button class="filter" data-filter="today">DZISIAJ</button>
                <button class="filter" data-filter="tomorrow">JUTRO</button>
                <button class="filter" data-filter="weekend">W WEEKEND</button>
            </div>
        </div>

        <div class="month-navigation">

            <button class="month-btn" id="prevMonth">
                ‹
            </button>

            <div class="month-title" id="monthTitle"></div>

            <button class="month-btn" id="nextMonth">
                ›
            </button>

        </div>

    </div>


    <div class="calendar-wrap">

        <div class="weekdays">
            <div class="weekday">PONIEDZIAŁEK</div>
            <div class="weekday">WTOREK</div>
            <div class="weekday">ŚRODA</div>
            <div class="weekday">CZWARTEK</div>
            <div class="weekday">PIĄTEK</div>
            <div class="weekday">SOBOTA</div>
            <div class="weekday">NIEDZIELA</div>
        </div>

        <div class="calendar" id="calendar"></div>

    </div>


    <section class="details" id="details">

        <div class="details-grid">

            <aside class="date-panel">

                <div>
                    <div class="date-weekday" id="selectedWeekday"></div>
                    <div class="date-number" id="selectedNumber"></div>
                </div>

                <div>
                    <div class="date-month" id="selectedMonth"></div>
                    <div class="date-year" id="selectedYear"></div>
                    <div class="folk-date-decoration"></div>
                </div>

                <div class="stats" id="stats"></div>

            </aside>


            <div class="events-area">

                <div class="events-header">

                    <div class="events-title">
                        WYDARZENIA W TYM DNIU
                    </div>

                    <button class="close-details" id="closeDetails">
                        ZAMKNIJ ×
                    </button>

                </div>

                <div class="event-grid" id="eventGrid"></div>

            </div>

        </div>

    </section>

</main>


<footer class="footer">
    © 2026 Mapa Łowickich Aktywności – Łowicz
</footer>


<script>

const MONTHS = [
    "STYCZEŃ",
    "LUTY",
    "MARZEC",
    "KWIECIEŃ",
    "MAJ",
    "CZERWIEC",
    "LIPIEC",
    "SIERPIEŃ",
    "WRZESIEŃ",
    "PAŹDZIERNIK",
    "LISTOPAD",
    "GRUDZIEŃ"
];

const WEEKDAYS = [
    "NIEDZIELA",
    "PONIEDZIAŁEK",
    "WTOREK",
    "ŚRODA",
    "CZWARTEK",
    "PIĄTEK",
    "SOBOTA"
];

let eventsData = {};

const today = new Date();

let currentYear = today.getFullYear();
let currentMonth = today.getMonth();

let selectedDate = null;


/* CATEGORY */

function getCategoryIcon(category = ""){

    const c = category.toLowerCase();

    if(
        c.includes("kino")
    ){
        return "🎬";
    }

    if(
        c.includes("koncert") ||
        c.includes("muzyka") ||
        c.includes("festiwal organowy")
    ){
        return "🎵";
    }

    if(
        c.includes("kabaret") ||
        c.includes("stand-up")
    ){
        return "😂";
    }

    if(
        c.includes("teatr")
    ){
        return "🎭";
    }

    if(
        c.includes("bieg") ||
        c.includes("sport") ||
        c.includes("turniej") ||
        c.includes("piłk")
    ){
        return "🏃";
    }

    if(
        c.includes("rodzin") ||
        c.includes("dzieck") ||
        c.includes("piknik")
    ){
        return "👨‍👩‍👧";
    }

    if(
        c.includes("warsztat") ||
        c.includes("wycinank") ||
        c.includes("folklor")
    ){
        return "🌼";
    }

    if(
        c.includes("rower") ||
        c.includes("kajak") ||
        c.includes("turysty")
    ){
        return "🚲";
    }

    if(
        c.includes("gry")
    ){
        return "🎲";
    }

    return "●";
}


function getCategoryColor(category = ""){

    const c = category.toLowerCase();

    if(c.includes("kino")) return "#167ac6";

    if(
        c.includes("koncert") ||
        c.includes("muzyka")
    ) return "#d71920";

    if(
        c.includes("kabaret") ||
        c.includes("stand-up") ||
        c.includes("teatr")
    ) return "#7e3fa0";

    if(
        c.includes("bieg") ||
        c.includes("sport") ||
        c.includes("turniej")
    ) return "#2d9b50";

    if(
        c.includes("rodzin") ||
        c.includes("piknik")
    ) return "#e89a17";

    if(
        c.includes("warsztat") ||
        c.includes("folklor")
    ) return "#dc5b91";

    return "#555";
}


/* CINEMA */

function expandEvents(events){

    const result = [];

    events.forEach(event => {

        if(
            event.type === "cinema" &&
            Array.isArray(event.movies)
        ){

            event.movies.forEach(movie => {

                result.push({

                    title: movie.title,

                    time: movie.times
                        ? movie.times.join(", ")
                        : "",

                    times: movie.times || [],

                    image: movie.image,

                    place: event.place,

                    category: event.category,

                    organizer: event.organizer,

                    source: event.source,

                    cinema: true

                });

            });

        }else{

            result.push(event);

        }

    });

    return result;

}


/* DATE */

function formatDateKey(year,month,day){

    return [
        year,
        String(month + 1).padStart(2,"0"),
        String(day).padStart(2,"0")
    ].join("-");

}


/* LOAD */

async function loadEvents(){

    try{

        const response = await fetch(
            "events.json?v=" + Date.now()
        );

        if(!response.ok){
            throw new Error("Nie udało się pobrać events.json");
        }

        eventsData = await response.json();

        renderCalendar();

    }catch(error){

        console.error(error);

        document.getElementById("calendar").innerHTML = `
            <div style="
                grid-column:1/-1;
                padding:50px;
                text-align:center;
            ">
                Nie udało się wczytać wydarzeń.
            </div>
        `;

    }

}


/* CALENDAR */

function renderCalendar(){

    const calendar =
        document.getElementById("calendar");

    calendar.innerHTML = "";

    document.getElementById("monthTitle").textContent =
        MONTHS[currentMonth] + " " + currentYear;


    const firstDay =
        new Date(currentYear,currentMonth,1);

    const lastDay =
        new Date(currentYear,currentMonth + 1,0);

    let startDay = firstDay.getDay();

    if(startDay === 0){
        startDay = 7;
    }


    const previousMonthLastDay =
        new Date(currentYear,currentMonth,0)
        .getDate();


    for(let i = startDay - 2; i >= 0; i--){

        createDayCell(
            previousMonthLastDay - i,
            true
        );

    }


    for(let day = 1; day <= lastDay.getDate(); day++){

        createDayCell(
            day,
            false
        );

    }


    const totalCells =
        calendar.children.length;

    const remaining =
        totalCells <= 35
            ? 35 - totalCells
            : 42 - totalCells;


    for(let day = 1; day <= remaining; day++){

        createDayCell(
            day,
            true
        );

    }

}


function createDayCell(day,isOtherMonth){

    const calendar =
        document.getElementById("calendar");

    const cell =
        document.createElement("div");

    cell.className = "day";


    if(isOtherMonth){

        cell.classList.add("other-month");

        cell.innerHTML = `
            <div class="day-number">
                ${day}
            </div>
        `;

        calendar.appendChild(cell);

        return;

    }


    const dateKey =
        formatDateKey(
            currentYear,
            currentMonth,
            day
        );


    const rawEvents =
        eventsData[dateKey] || [];


    const events =
        expandEvents(rawEvents);


    if(events.length){

        cell.classList.add("has-events");

    }


    if(selectedDate === dateKey){

        cell.classList.add("selected");

    }


    const images = events
        .map(event => event.image)
        .filter(Boolean);


    const uniqueImages =
        [...new Set(images)];


    if(uniqueImages.length){

        cell.classList.add("has-poster");

        const imagesToShow =
            uniqueImages.slice(0,4);


        let mosaicClass = "";

        if(imagesToShow.length === 2){
            mosaicClass = "count-2";
        }

        if(imagesToShow.length === 3){
            mosaicClass = "count-3";
        }

        if(imagesToShow.length >= 4){
            mosaicClass = "count-many";
        }


        cell.innerHTML = `

            <div class="
                poster-mosaic
                ${mosaicClass}
            ">

                ${imagesToShow.map(image => `
                    <img
                        src="${escapeHtml(image)}"
                        alt=""
                        loading="lazy"
                        onerror="this.style.display='none'"
                    >
                `).join("")}

            </div>

            <div class="day-number">
                ${day}
            </div>

            ${createEventSummary(events)}

        `;

    }else{

        cell.innerHTML = `

            <div class="day-number">
                ${day}
            </div>

            ${events.length
                ? createSimpleSummary(events)
                : ""
            }

        `;

    }


    if(events.length){

        cell.addEventListener("click",() => {

            showDay(dateKey);

        });

    }


    calendar.appendChild(cell);

}


function createEventSummary(events){

    const icons = [
        ...new Set(
            events.map(event =>
                getCategoryIcon(event.category)
            )
        )
    ];


    const visibleIcons =
        icons.slice(0,3);


    const extra =
        events.length > 3
            ? events.length - 3
            : 0;


    return `

        <div class="event-summary">

            <div class="category-icons">

                ${visibleIcons.map(icon => `
                    <span class="category-icon">
                        ${icon}
                    </span>
                `).join("")}

                ${extra > 0
                    ? `<span class="more-count">+${extra}</span>`
                    : ""
                }

            </div>

            <div class="event-count">

                ${events.length}
                ${eventWord(events.length)}

            </div>

        </div>

    `;

}


function createSimpleSummary(events){

    const icons = [
        ...new Set(
            events.map(event =>
                getCategoryIcon(event.category)
            )
        )
    ];


    return `

        <div class="simple-summary">

            <div class="simple-icons">
                ${icons.slice(0,3).join(" ")}
            </div>

            <div class="simple-count">
                ${events.length}
                ${eventWord(events.length)}
            </div>

        </div>

    `;

}


function eventWord(number){

    if(number === 1){
        return "wydarzenie";
    }

    if(
        number >= 2 &&
        number <= 4
    ){
        return "wydarzenia";
    }

    return "wydarzeń";

}


/* DETAILS */

function showDay(dateKey){

    selectedDate = dateKey;

    renderCalendar();


    const date =
        new Date(dateKey + "T12:00:00");


    const rawEvents =
        eventsData[dateKey] || [];


    const events =
        expandEvents(rawEvents);


    document.getElementById(
        "selectedWeekday"
    ).textContent =
        WEEKDAYS[date.getDay()];


    document.getElementById(
        "selectedNumber"
    ).textContent =
        date.getDate();


    document.getElementById(
        "selectedMonth"
    ).textContent =
        MONTHS[date.getMonth()];


    document.getElementById(
        "selectedYear"
    ).textContent =
        date.getFullYear();


    renderStats(events);

    renderEvents(events);


    const details =
        document.getElementById("details");


    details.classList.add("visible");


    setTimeout(() => {

        details.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    },100);

}


function renderStats(events){

    const stats = {};

    events.forEach(event => {

        const category =
            event.category || "Inne";

        stats[category] =
            (stats[category] || 0) + 1;

    });


    const html = `

        <div class="stats-total">

            ${events.length}
            ${eventWord(events.length)}

        </div>

        ${Object.entries(stats)
            .slice(0,6)
            .map(([category,count]) => `

                <div class="stat-row">

                    <span class="stat-name">

                        <span>
                            ${getCategoryIcon(category)}
                        </span>

                        ${escapeHtml(category)}

                    </span>

                    <strong>
                        ${count}
                    </strong>

                </div>

            `).join("")
        }

    `;


    document.getElementById("stats").innerHTML =
        html;

}


function renderEvents(events){

    const grid =
        document.getElementById("eventGrid");


    if(!events.length){

        grid.innerHTML = `

            <div class="empty-info">

                <div class="empty-icon">
                    📅
                </div>

                Brak wydarzeń w tym dniu.

            </div>

        `;

        return;

    }


    grid.innerHTML = events.map(event => {

        const categoryColor =
            getCategoryColor(event.category);


        return `

            <article class="
                event-card
                ${event.cinema ? "cinema-card" : ""}
            ">

                <div class="event-image">

                    ${event.image
                        ? `
                            <img
                                src="${escapeHtml(event.image)}"
                                alt="${escapeHtml(event.title)}"
                                loading="lazy"
                                onerror="
                                    this.style.display='none'
                                "
                            >
                        `
                        : ""
                    }

                    ${event.time
                        ? `
                            <div
                                class="event-time"
                                style="
                                    background:${categoryColor}
                                "
                            >
                                ${escapeHtml(event.time)}
                            </div>
                        `
                        : ""
                    }

                </div>


                <div class="event-content">

                    <div class="event-name">
                        ${escapeHtml(event.title)}
                    </div>


                    ${event.place
                        ? `
                            <div class="event-place">
                                📍 ${escapeHtml(event.place)}
                            </div>
                        `
                        : ""
                    }


                    ${event.organizer
                        ? `
                            <div class="event-organizer">
                                Organizator:
                                ${escapeHtml(event.organizer)}
                            </div>
                        `
                        : ""
                    }


                    ${event.cinema && event.times
                        ? `
                            <div class="cinema-times">

                                ${event.times.map(time => `
                                    <span class="cinema-time">
                                        ${escapeHtml(time)}
                                    </span>
                                `).join("")}

                            </div>
                        `
                        : ""
                    }


                    <div class="event-bottom">

                        <span
                            class="category-tag"
                            style="
                                color:${categoryColor};
                                background:${categoryColor}15;
                            "
                        >
                            ${getCategoryIcon(event.category)}
                            ${escapeHtml(event.category || "Inne")}
                        </span>


                        ${event.source
                            ? `
                                <a
                                    class="event-link"
                                    href="${escapeHtml(event.source)}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    WIĘCEJ →
                                </a>
                            `
                            : ""
                        }

                    </div>

                </div>

            </article>

        `;

    }).join("");

}


/* FILTERS */

document.querySelectorAll(".filter")
.forEach(button => {

    button.addEventListener("click",() => {

        document
            .querySelectorAll(".filter")
            .forEach(item =>
                item.classList.remove("active")
            );


        button.classList.add("active");


        const filter =
            button.dataset.filter;


        if(filter === "all"){

            selectedDate = null;

            document
                .getElementById("details")
                .classList.remove("visible");

            renderCalendar();

            return;

        }


        let date = new Date();


        if(filter === "tomorrow"){

            date.setDate(
                date.getDate() + 1
            );

        }


        if(filter === "weekend"){

            const day =
                date.getDay();

            let daysToSaturday =
                6 - day;

            if(daysToSaturday < 0){
                daysToSaturday += 7;
            }

            date.setDate(
                date.getDate() +
                daysToSaturday
            );

        }


        currentYear =
            date.getFullYear();

        currentMonth =
            date.getMonth();


        const dateKey =
            formatDateKey(
                date.getFullYear(),
                date.getMonth(),
                date.getDate()
            );


        renderCalendar();

        showDay(dateKey);

    });

});


/* NAVIGATION */

document.getElementById("prevMonth")
.addEventListener("click",() => {

    currentMonth--;

    if(currentMonth < 0){

        currentMonth = 11;
        currentYear--;

    }

    selectedDate = null;

    document
        .getElementById("details")
        .classList.remove("visible");

    renderCalendar();

});


document.getElementById("nextMonth")
.addEventListener("click",() => {

    currentMonth++;

    if(currentMonth > 11){

        currentMonth = 0;
        currentYear++;

    }

    selectedDate = null;

    document
        .getElementById("details")
        .classList.remove("visible");

    renderCalendar();

});


document.getElementById("closeDetails")
.addEventListener("click",() => {

    selectedDate = null;

    document
        .getElementById("details")
        .classList.remove("visible");

    renderCalendar();

});


/* SECURITY */

function escapeHtml(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* START */

loadEvents();

</script>
