<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa Łowickich Aktywności</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --navy:#071d55;
    --red:#e30613;
    --border:#e5e7eb;
    --muted:#667085;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#ffffff;
    color:var(--navy);
    font-family:Arial,Helvetica,sans-serif;
}

button,
a{
    font-family:inherit;
}

img{
    display:block;
}


/* =========================
   NAGŁÓWEK
========================= */

.site-header{
    width:100%;
    background:white;
}

.header-image{
    width:100%;
    max-width:1000px;
    margin:0 auto;
}

.header-image img{
    width:100%;
    height:auto;
}


/* =========================
   MENU
========================= */

.main-nav{
    width:100%;
    border-top:1px solid #eeeeee;
    border-bottom:1px solid #e5e7eb;
    background:white;
}

.nav-inner{
    max-width:1450px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.nav-link{
    position:relative;
    min-height:100px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:20px;
    text-decoration:none;
    color:var(--navy);
    font-weight:800;
}

.nav-link:hover{
    background:#fffafa;
}

.nav-link.active{
    color:var(--red);
}

.nav-link.active::after{
    content:"";
    position:absolute;
    left:12%;
    right:12%;
    bottom:0;
    height:4px;
    background:var(--red);
}

.nav-icon{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    flex-shrink:0;
}

.nav-text{
    font-size:17px;
    line-height:1.1;
    text-transform:uppercase;
}

.nav-text span{
    display:block;
}


/* =========================
   STRONA
========================= */

.page{
    max-width:1450px;
    margin:0 auto;
    padding:45px 35px 70px;
}


/* =========================
   KALENDARZ + ZGŁOŚ
========================= */

.calendar-section{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:45px;
    align-items:stretch;
}


/* =========================
   KALENDARZ
========================= */

.calendar-box{
    width:100%;
}

.month-navigation{
    display:grid;
    grid-template-columns:60px 1fr 60px;
    align-items:center;
    margin-bottom:24px;
}

.month-title{
    text-align:center;
    font-size:32px;
    font-weight:900;
    color:var(--red);
    text-transform:uppercase;
}

.month-btn{
    width:52px;
    height:52px;
    border:0;
    background:transparent;
    color:var(--red);
    font-size:52px;
    line-height:1;
    cursor:pointer;
    transition:.2s;
}

.month-btn:hover{
    transform:scale(1.15);
}

.weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:10px;
}

.weekday{
    text-align:center;
    padding:10px 2px;
    font-size:16px;
    font-weight:900;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    padding:15px;
    background:white;
}

.day{
    position:relative;
    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    color:#111;
    cursor:default;
    border-radius:12px;
    transition:.2s;
}

.day.other-month{
    color:#b8b8b8;
}

.day.has-events{
    cursor:pointer;
    font-weight:700;
}

.day.has-events:hover{
    background:#fff0f1;
    color:var(--red);
}

.day.selected{
    background:var(--red);
    color:white;
    font-weight:900;
    box-shadow:0 7px 18px rgba(227,6,19,.25);
}


/* =========================
   ZGŁOŚ WYDARZENIE
========================= */

.submit-event{
    display:block;
    width:100%;
    border-radius:22px;
    overflow:hidden;
    text-decoration:none;
    transition:.25s;
    background:#faf7f0;
}

.submit-event:hover{
    transform:translateY(-5px);
    box-shadow:0 18px 40px rgba(7,29,85,.14);
}

.submit-event img{
    width:100%;
    height:100%;
    object-fit:cover;
}


/* =========================
   WYDARZENIA
========================= */

.events-section{
    margin-top:55px;
}

.events-heading{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:30px;
    font-size:28px;
    font-weight:900;
}

.events-heading-icon{
    width:43px;
    height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
}


/* =========================
   KAFELKI
========================= */

.events-list{
    display:grid;
    grid-template-columns:repeat(4,237px);
    gap:30px;
    align-items:start;
    justify-content:center;
}

.event-card{
    display:block;
    min-width:0;
    color:inherit;
    text-decoration:none;
}

.event-tile{
    background:white;
    border:1px solid #dddddd;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 2px 9px rgba(0,0,0,.12);
    cursor:pointer;
    transition:.22s;
}

.event-tile:hover{
    transform:translateY(-4px);
    box-shadow:0 9px 22px rgba(0,0,0,.17);
}


/* =========================
   PLAKAT + ROZMYTE TŁO
========================= */

.event-poster-box{
    position:relative;
    width:100%;
    height:290px;
    overflow:hidden;
    background:#ece9e2;
    display:flex;
    align-items:center;
    justify-content:center;
}

.event-poster-background{
    position:absolute;
    inset:-25px;
    width:calc(100% + 50px);
    height:calc(100% + 50px);
    object-fit:cover;
    object-position:center;
    filter:blur(20px);
    opacity:.62;
    transform:scale(1.12);
    z-index:1;
}

.event-poster-box::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.06);
    z-index:2;
    pointer-events:none;
}

.event-poster-main{
    position:relative;
    z-index:3;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
}

.event-no-image{
    position:relative;
    z-index:3;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:65px;
    background:#f7f5ef;
}


/* =========================
   TREŚĆ KAFELKA
========================= */

.event-tile-content{
    padding:13px 15px 15px;
}

.event-title-row{
    display:grid;
    grid-template-columns:42px minmax(0,1fr);
    gap:9px;
    align-items:center;
    min-height:48px;
}

.event-category-icon{
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:18px;
}

.event-title{
    color:var(--navy);
    font-size:14px;
    font-weight:700;
    line-height:1.35;
}

.event-divider{
    height:1px;
    background:#dddddd;
    margin:9px 0 8px;
}

.event-meta{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.event-meta-row{
    color:#303030;
    font-size:11px;
    line-height:1.25;
}


/* =========================
   BRAK WYDARZEŃ
========================= */

.empty-events{
    grid-column:1 / -1;
    padding:60px 25px;
    text-align:center;
    color:var(--muted);
    font-size:18px;
}


/* =========================
   POKAŻ WIĘCEJ
========================= */

.show-more-wrap{
    display:flex;
    justify-content:center;
    margin-top:35px;
}

.show-more{
    border:1.5px solid var(--red);
    background:white;
    color:var(--red);
    padding:14px 35px;
    border-radius:30px;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
    text-transform:uppercase;
}

.show-more:hover{
    background:var(--red);
    color:white;
}


/* =========================
   STOPKA
========================= */

.footer{
    border-top:1px solid var(--border);
    padding:35px 20px;
    text-align:center;
    color:#777;
    font-size:13px;
}


/* =========================
   TABLET
========================= */

@media(max-width:1100px){

    .page{
        padding-left:20px;
        padding-right:20px;
    }

    .calendar-section{
        gap:25px;
    }

    .events-list{
        grid-template-columns:repeat(3,237px);
        gap:22px;
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .nav-inner{
        grid-template-columns:repeat(4,1fr);
    }

    .nav-link{
        min-height:82px;
        padding:12px 5px;
        gap:6px;
        flex-direction:column;
    }

    .nav-icon{
        width:27px;
        height:27px;
        font-size:23px;
    }

    .nav-text{
        text-align:center;
        font-size:9px;
    }

    .nav-link.active::after{
        left:5%;
        right:5%;
        height:3px;
    }

    .page{
        padding:25px 12px 50px;
    }

    .calendar-section{
        grid-template-columns:1fr;
        gap:25px;
    }

    .month-navigation{
        margin-bottom:12px;
    }

    .month-title{
        font-size:25px;
    }

    .month-btn{
        width:45px;
        height:45px;
        font-size:43px;
    }

    .weekday{
        font-size:11px;
    }

    .calendar{
        padding:7px;
        border-radius:13px;
    }

    .day{
        min-height:53px;
        font-size:17px;
        border-radius:8px;
    }

    .submit-event{
        border-radius:15px;
    }

    .submit-event img{
        height:auto;
    }

    .events-section{
        margin-top:40px;
    }

    .events-heading{
        font-size:21px;
        margin-bottom:22px;
    }

    .events-heading-icon{
        width:32px;
        height:32px;
        font-size:25px;
    }

    .events-list{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;
        justify-content:stretch;
    }

    .event-poster-box{
        height:220px;
    }

    .event-tile-content{
        padding:10px;
    }

    .event-title-row{
        grid-template-columns:34px minmax(0,1fr);
        gap:7px;
        min-height:42px;
    }

    .event-category-icon{
        width:34px;
        height:34px;
        font-size:15px;
    }

    .event-title{
        font-size:12px;
    }

    .event-meta-row{
        font-size:10px;
    }

}


/* =========================
   MAŁE TELEFONY
========================= */

@media(max-width:430px){

    .nav-text{
        font-size:8px;
    }

    .weekday{
        font-size:9px;
    }

    .day{
        min-height:47px;
        font-size:15px;
    }

    .month-title{
        font-size:22px;
    }

    .events-list{
        gap:9px;
    }

    .event-poster-box{
        height:195px;
    }

    .event-tile-content{
        padding:8px;
    }

    .event-title-row{
        grid-template-columns:31px minmax(0,1fr);
        gap:6px;
        min-height:38px;
    }

    .event-category-icon{
        width:31px;
        height:31px;
        font-size:14px;
    }

    .event-title{
        font-size:11px;
        line-height:1.3;
    }

    .event-meta-row{
        font-size:9px;
    }

}

</style>

</head>

<body>

    <div class="header-image">

        <img
            src="naglowek.png"
            alt="Mapa Łowickich Aktywności"

    </div>

</header>


<nav class="main-nav">

    <div class="nav-inner">

        <a href="#kalendarz" class="nav-link active">

            <span class="nav-icon">📅</span>

            <span class="nav-text">

<footer class="footer">

<script>


const MONTHS = [

    "STYCZEŃ",
    "LUTY",
    "MARZEC",
    "KWIECIEŃ",
    "MAJ",
    "CZERWIEC",
    "LIPIEC",
    "SIERPIEŃ",
    "WRZESIEŃ",
    "PAŹDZIERNIK",
    "LISTOPAD",
    "GRUDZIEŃ"

];


let eventsData = {};

const today = new Date();

let currentYear = today.getFullYear();

let currentMonth = today.getMonth();

let selectedDate = null;

let visibleEvents = 8;



function formatDateKey(year,month,day){

    return [

        year,

        String(month + 1).padStart(2,"0"),

        String(day).padStart(2,"0")

    ].join("-");

}



function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}



function expandEvents(events){

    const result = [];


    events.forEach(event => {


        if(
            event.type === "cinema" &&
            Array.isArray(event.movies)
        ){


            event.movies.forEach(movie => {


                result.push({

                    title:movie.title,

                    time:movie.times
                        ? movie.times.join(", ")
                        : "",

                    image:movie.image,

                    place:event.place,

                    category:event.category || "Kino",

                    organizer:event.organizer,

                    source:event.source,

                    description:
                        movie.description ||
                        event.description ||
                        ""

                });


            });


        }else{


            result.push(event);


        }


    });


    return result;

}



function getCategoryStyle(category = ""){

    const value = category.toLowerCase();


    if(
        value.includes("kino") ||
        value.includes("film")
    ){

        return {
            icon:"🎬",
            color:"#3d9555"
        };

    }


    if(
        value.includes("koncert") ||
        value.includes("muzyka")
    ){

        return {
            icon:"♫",
            color:"#58a7cd"
        };

    }


    if(
        value.includes("teatr") ||
        value.includes("spektakl")
    ){

        return {
            icon:"🎭",
            color:"#812719"
        };

    }


    if(
        value.includes("kabaret") ||
        value.includes("stand")
    ){

        return {
            icon:"🎭",
            color:"#ef4819"
        };

    }


    if(
        value.includes("warsztat") ||
        value.includes("folklor")
    ){

        return {
            icon:"🧵",
            color:"#f5a900"
        };

    }


    if(
        value.includes("sport") ||
        value.includes("bieg") ||
        value.includes("rower")
    ){

        return {
            icon:"🏃",
            color:"#d40d27"
        };

    }


    if(
        value.includes("rodzin") ||
        value.includes("dziec")
    ){

        return {
            icon:"★",
            color:"#70c7aa"
        };

    }


    if(value.includes("motoryz")){

        return {
            icon:"🚗",
            color:"#ef7f00"
        };

    }


    if(
        value.includes("kultur") ||
        value.includes("literatur")
    ){

        return {
            icon:"📖",
            color:"#373174"
        };

    }


    return {
        icon:"✦",
        color:"#b85193"
    };

}



async function loadEvents(){

    try{


        const cacheBust = Date.now();


        const [
            eventsResponse,
            cinemaResponse
        ] = await Promise.all([

            fetch("events.json?v=" + cacheBust),

            fetch("cinema.json?v=" + cacheBust)

        ]);


        if(!eventsResponse.ok){

            throw new Error("Błąd events.json");

        }


        if(!cinemaResponse.ok){

            throw new Error("Błąd cinema.json");

        }


        const [
            regularEvents,
            cinemaEvents
        ] = await Promise.all([

            eventsResponse.json(),

            cinemaResponse.json()

        ]);


        const allDates = new Set([

            ...Object.keys(regularEvents),

            ...Object.keys(cinemaEvents)

        ]);


        eventsData = {};


        allDates.forEach(dateKey => {

            eventsData[dateKey] = [

                ...(regularEvents[dateKey] || []),

                ...(cinemaEvents[dateKey] || [])

            ];

        });


        renderCalendar();

        renderUpcomingEvents();


    }catch(error){


        console.error(error);


        document
            .getElementById("eventsList")
            .innerHTML = `

                <div class="empty-events">

                    Nie udało się wczytać wydarzeń.

                </div>

            `;


    }

}



function renderCalendar(){

    const calendar =
        document.getElementById("calendar");


    calendar.innerHTML = "";


    document
        .getElementById("monthTitle")
        .textContent =

        MONTHS[currentMonth] +
        " " +
        currentYear;



    const firstDay = new Date(

        currentYear,
        currentMonth,
        1

    );


    const lastDay = new Date(

        currentYear,
        currentMonth + 1,
        0

    );


    let startDay = firstDay.getDay();


    if(startDay === 0){

        startDay = 7;

    }


    const previousMonthLastDay =

        new Date(
            currentYear,
            currentMonth,
            0
        ).getDate();



    for(
        let i = startDay - 2;
        i >= 0;
        i--
    ){

        createDay(
            previousMonthLastDay - i,
            true
        );

    }



    for(
        let day = 1;
        day <= lastDay.getDate();
        day++
    ){

        createDay(
            day,
            false
        );

    }



    const cells = calendar.children.length;


    const targetCells =
        cells <= 35
            ? 35
            : 42;


    const remaining =
        targetCells - cells;



    for(
        let day = 1;
        day <= remaining;
        day++
    ){

        createDay(
            day,
            true
        );

    }

}



function createDay(day,otherMonth){

    const calendar =
        document.getElementById("calendar");


    const cell =
        document.createElement("div");


    cell.className = "day";


    if(otherMonth){

        cell.classList.add("other-month");

        cell.textContent = day;

        calendar.appendChild(cell);

        return;

    }


    const dateKey = formatDateKey(

        currentYear,
        currentMonth,
        day

    );


    const events = expandEvents(

        eventsData[dateKey] || []

    );


    if(events.length){

        cell.classList.add("has-events");


        cell.addEventListener(

            "click",

            () => {

                selectDate(dateKey);

            }

        );

    }


    if(selectedDate === dateKey){

        cell.classList.add("selected");

    }


    cell.textContent = day;


    calendar.appendChild(cell);

}



function selectDate(dateKey){

    selectedDate = dateKey;

    visibleEvents = 8;


    renderCalendar();

    renderSelectedEvents();


    document
        .querySelector(".events-section")
        .scrollIntoView({

            behavior:"smooth",

            block:"start"

        });

}



function renderSelectedEvents(){

    const date = new Date(

        selectedDate + "T12:00:00"

    );


    const events = expandEvents(

        eventsData[selectedDate] || []

    );


    const preparedEvents = events.map(

        (event,eventIndex) => ({

            ...event,

            dateKey:selectedDate,

            eventIndex

        })

    );


    document
        .getElementById("eventsHeading")
        .textContent =

        "Wydarzenia – " +

        date.getDate() +

        " " +

        MONTHS[
            date.getMonth()
        ].toLowerCase();


    renderEvents(preparedEvents);

}



function renderUpcomingEvents(){

    const allEvents = [];


    const now = new Date();


    const todayKey = formatDateKey(

        now.getFullYear(),

        now.getMonth(),

        now.getDate()

    );


    Object.keys(eventsData)

        .filter(key =>

            /^\d{4}-\d{2}-\d{2}$/.test(key)

        )

        .filter(dateKey =>

            dateKey >= todayKey

        )

        .sort()

        .forEach(dateKey => {


            const events = expandEvents(

                eventsData[dateKey] || []

            );


            events.forEach(

                (event,eventIndex) => {


                    allEvents.push({

                        ...event,

                        dateKey,

                        eventIndex

                    });


                }

            );


        });


    document
        .getElementById("eventsHeading")
        .textContent =

        "Nadchodzące wydarzenia";


    renderEvents(allEvents);

}



function renderEvents(events){

    const list =
        document.getElementById("eventsList");


    const showMoreWrap =
        document.getElementById("showMoreWrap");


    if(!events.length){


        list.innerHTML = `

            <div class="empty-events">

                Brak wydarzeń w tym dniu.

            </div>

        `;


        showMoreWrap.style.display = "none";


        return;

    }


    const visible = events.slice(

        0,
        visibleEvents

    );


    list.innerHTML = visible.map(event => {


        const date = new Date(

            event.dateKey + "T12:00:00"

        );


        const formattedDate =

            date.toLocaleDateString(

                "pl-PL",

                {

                    day:"numeric",

                    month:"short",

                    year:"2-digit"

                }

            );


        const category = getCategoryStyle(

            event.category || ""

        );


        const eventUrl =

            "wydarzenie.html?date=" +

            encodeURIComponent(event.dateKey) +

            "&event=" +

            encodeURIComponent(event.eventIndex);


        return `


            <a
                class="event-card"
                href="${eventUrl}"
            >


                <div class="event-tile">


                    <div class="event-poster-box">


                        ${

                            event.image

                            ? `

                                <img

                                    class="event-poster-background"

                                    src="${escapeHtml(event.image)}"

                                    alt=""

                                    aria-hidden="true"

                                >


                                <img

                                    class="event-poster-main"

                                    src="${escapeHtml(event.image)}"

                                    alt="${escapeHtml(event.title)}"

                                    loading="lazy"

                                >

                            `

                            : `

                                <div class="event-no-image">

                                    ${category.icon}

                                </div>

                            `

                        }


                    </div>


                    <div class="event-tile-content">


                        <div class="event-title-row">


                            <div
                                class="event-category-icon"
                                style="background:${category.color};"
                            >

                                ${category.icon}

                            </div>


                            <div class="event-title">

                                ${escapeHtml(event.title)}

                            </div>


                        </div>


                        <div class="event-divider"></div>


                        <div class="event-meta">


                            ${

                                event.place

                                ? `

                                    <div class="event-meta-row">

                                        📍 ${escapeHtml(event.place)}

                                    </div>

                                `

                                : ""

                            }


                            <div class="event-meta-row">

                                🗓 ${formattedDate}

                            </div>


                            ${

                                event.time

                                ? `

                                    <div class="event-meta-row">

                                        ◷ ${escapeHtml(event.time)}

                                    </div>

                                `

                                : ""

                            }


                        </div>


                    </div>


                </div>


            </a>


        `;


    }).join("");


    showMoreWrap.style.display =

        events.length > visibleEvents

            ? "flex"

            : "none";


    document
        .getElementById("showMore")
        .onclick = () => {


            visibleEvents += 8;


            renderEvents(events);


        };

}



document
    .getElementById("prevMonth")
    .addEventListener(

        "click",

        () => {


            currentMonth--;


            if(currentMonth < 0){

                currentMonth = 11;

                currentYear--;

            }


            selectedDate = null;


            renderCalendar();

            renderUpcomingEvents();


        }

    );



document
    .getElementById("nextMonth")
    .addEventListener(

        "click",

        () => {


            currentMonth++;


            if(currentMonth > 11){

                currentMonth = 0;

                currentYear++;

            }


            selectedDate = null;


            renderCalendar();

            renderUpcomingEvents();


        }

    );



document
    .getElementById("submitEvent")
    .addEventListener(

        "click",

        event => {


            event.preventDefault();


            alert(

                "Formularz zgłaszania wydarzeń dodamy w kolejnym kroku."

            );


        }

    );



loadEvents();


</script>
